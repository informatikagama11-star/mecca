        let questionBankCache = {};

        window.filterQuestionBank = function() {
            const select = document.getElementById('question-chapter-filter');
            if (!select) return;
            const filter = select.value || '__ALL__';
            const tbody = document.getElementById('questions-tbody');
            if (!tbody) return;

            const items = Object.keys(questionBankCache).map(id => ({ id, ...questionBankCache[id] }))
                .filter(q => filter === '__ALL__' || getQuestionChapter(q) === filter)
                .sort((a, b) => {
                    const ca = getQuestionChapter(a), cb = getQuestionChapter(b);
                    const chapterCompare = ca.localeCompare(cb, 'id', { numeric: true, sensitivity: 'base' });
                    return chapterCompare || String(a.question || '').localeCompare(String(b.question || ''), 'id');
                });

            const activeFilter = document.getElementById('chapter-active-filter');
            if (activeFilter) activeFilter.innerText = filter === '__ALL__' ? 'Semua Bab' : filter;

            if (!items.length) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-10 text-center text-slate-400">Belum ada soal pada bab ini.</td></tr>`;
                return;
            }

            let lastChapter = null;
            tbody.innerHTML = items.map(q => {
                const chapter = getQuestionChapter(q);
                const chapterHeader = chapter !== lastChapter ? `<tr class="bg-brand-50/70"><td colspan="5" class="py-2.5 px-6 text-xs font-extrabold text-brand-700 uppercase tracking-wide"><i class="fa-solid fa-book-open mr-2"></i>${escapeHtml(chapter)}</td></tr>` : '';
                lastChapter = chapter;
                const type = normalizeQuestionType(q.type);
                const badge = type === 'PG'
                    ? '<span class="px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-lg text-xs font-bold">PG</span>'
                    : type === 'PG_COMPLEX'
                        ? '<span class="px-2.5 py-1 bg-amber-50 text-amber-700 rounded-lg text-xs font-bold">PG Kompleks</span>'
                        : type === 'ISIAN'
                            ? '<span class="px-2.5 py-1 bg-blue-50 text-blue-700 rounded-lg text-xs font-bold">Isian</span>'
                            : '<span class="px-2.5 py-1 bg-purple-50 text-purple-700 rounded-lg text-xs font-bold">Essay</span>';
                return `${chapterHeader}
                    <tr class="hover:bg-slate-50 transition">
                        <td class="py-4 px-6"><span class="px-2.5 py-1 bg-slate-100 text-slate-700 rounded-lg text-xs font-bold">${escapeHtml(chapter)}</span></td>
                        <td class="py-4 px-6">${badge}</td>
                        <td class="py-4 px-6 font-medium text-slate-900 max-w-md truncate" title="${escapeHtml(q.question)}">${escapeHtml(q.question)}</td>
                        <td class="py-4 px-6 font-semibold text-slate-700">${getQuestionMaxPoints(q)}</td>
                        <td class="py-4 px-6 text-right whitespace-nowrap">
                            <button onclick="openEditQuestionModal('${q.id}')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold mr-1"><i class="fa-solid fa-pen"></i> Ubah</button>
                            <button onclick="deleteQuestion('${q.id}')" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded-lg text-xs font-semibold"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>`;
            }).join('');
        };

        function compositionKey(chapter) {
            return btoa(unescape(encodeURIComponent(String(chapter || '')))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
        }

        window.openQuestionCompositionModal = async function() {
            const snap = await window.FB.get(window.FB.ref(window.db, 'settings/questionComposition'));
            const saved = snap.exists() ? snap.val() : {};
            const chapters = getChapterList(questionBankCache);
            const defaultChapter = document.getElementById('question-chapter-filter')?.value;
            const chapter = defaultChapter && defaultChapter !== '__ALL__' && chapters.includes(defaultChapter) ? defaultChapter : (chapters[0] || '');
            const cfg = chapter ? (saved[compositionKey(chapter)] || {}) : {};
            const counts = { PG: Number(cfg.PG) || 0, PG_COMPLEX: Number(cfg.PG_COMPLEX) || 0, ISIAN: Number(cfg.ISIAN) || 0, ESSAY: Number(cfg.ESSAY) || 0 };
            const modalContainer = document.getElementById('modal-container');
            modalContainer.classList.remove('hidden');
            modalContainer.querySelector('#modal-content').innerHTML = `
                <div class="p-6 max-w-lg">
                    <div class="flex items-start justify-between gap-4 mb-5">
                        <div><h3 class="text-xl font-extrabold text-slate-900">Atur Jumlah Soal</h3><p class="text-sm text-slate-500 mt-1">Tentukan komposisi soal per BAB. Saat siswa ujian, soal akan diambil acak sesuai jumlah ini.</p></div>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-xl">&times;</button>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-bold text-slate-700 mb-1">BAB</label>
                        <select id="composition-chapter" class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-white" onchange="loadQuestionCompositionForChapter()">
                            ${chapters.length ? chapters.map(c => `<option value="${escapeHtml(c)}" ${c===chapter?'selected':''}>${escapeHtml(c)}</option>`).join('') : '<option value="">Belum ada BAB</option>'}
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="rounded-xl border border-indigo-100 bg-indigo-50 p-4"><span class="block text-xs font-bold text-indigo-700 mb-2">Pilihan Ganda</span><input id="composition-pg" type="number" min="0" step="1" value="${counts.PG}" class="w-full px-3 py-2.5 rounded-lg border border-indigo-200 bg-white font-bold"></label>
                        <label class="rounded-xl border border-amber-100 bg-amber-50 p-4"><span class="block text-xs font-bold text-amber-700 mb-2">PG Kompleks</span><input id="composition-pgc" type="number" min="0" step="1" value="${counts.PG_COMPLEX}" class="w-full px-3 py-2.5 rounded-lg border border-amber-200 bg-white font-bold"></label>
                        <label class="rounded-xl border border-blue-100 bg-blue-50 p-4"><span class="block text-xs font-bold text-blue-700 mb-2">Isian</span><input id="composition-isian" type="number" min="0" step="1" value="${counts.ISIAN}" class="w-full px-3 py-2.5 rounded-lg border border-blue-200 bg-white font-bold"></label>
                        <label class="rounded-xl border border-purple-100 bg-purple-50 p-4"><span class="block text-xs font-bold text-purple-700 mb-2">Essay</span><input id="composition-essay" type="number" min="0" step="1" value="${counts.ESSAY}" class="w-full px-3 py-2.5 rounded-lg border border-purple-200 bg-white font-bold"></label>
                    </div>
                    <div id="composition-available" class="mt-4 text-xs text-slate-500"></div>
                    <div class="flex gap-3 mt-6"><button onclick="closeModal()" class="flex-1 py-3 rounded-xl border border-slate-300 font-bold text-slate-700">Batal</button><button onclick="saveQuestionComposition()" class="flex-1 py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold">Simpan</button></div>
                </div>`;
            window.updateCompositionAvailability = function() {
                const ch = document.getElementById('composition-chapter')?.value || '';
                const qs = Object.values(questionBankCache).filter(q => getQuestionChapter(q) === ch && q.active !== false);
                const c = {PG:0, PG_COMPLEX:0, ISIAN:0, ESSAY:0}; qs.forEach(q => c[normalizeQuestionType(q.type)]++);
                const el = document.getElementById('composition-available'); if (el) el.innerHTML = `Tersedia di BAB ini: PG <b>${c.PG}</b> · PG Kompleks <b>${c.PG_COMPLEX}</b> · Isian <b>${c.ISIAN}</b> · Essay <b>${c.ESSAY}</b>`;
            };
            window.loadQuestionCompositionForChapter = async function() {
                const ch = document.getElementById('composition-chapter')?.value || '';
                const ss = await window.FB.get(window.FB.ref(window.db, 'settings/questionComposition'));
                const c = ss.exists() ? (ss.val()[compositionKey(ch)] || {}) : {};
                document.getElementById('composition-pg').value = Number(c.PG)||0; document.getElementById('composition-pgc').value = Number(c.PG_COMPLEX)||0; document.getElementById('composition-isian').value = Number(c.ISIAN)||0; document.getElementById('composition-essay').value = Number(c.ESSAY)||0; updateCompositionAvailability();
            };
            window.saveQuestionComposition = async function() {
                const ch = document.getElementById('composition-chapter')?.value || '';
                if (!ch) return window.showToast('Belum ada BAB yang bisa diatur.', 'warning');
                const cfg = { PG: Math.max(0, parseInt(document.getElementById('composition-pg').value)||0), PG_COMPLEX: Math.max(0, parseInt(document.getElementById('composition-pgc').value)||0), ISIAN: Math.max(0, parseInt(document.getElementById('composition-isian').value)||0), ESSAY: Math.max(0, parseInt(document.getElementById('composition-essay').value)||0) };
                const total = Object.values(cfg).reduce((a,b)=>a+b,0); if (!total) return window.showToast('Minimal ada 1 soal.', 'warning');
                const qs = Object.values(questionBankCache).filter(q => getQuestionChapter(q) === ch && q.active !== false); const available={PG:0,PG_COMPLEX:0,ISIAN:0,ESSAY:0}; qs.forEach(q=>available[normalizeQuestionType(q.type)]++);
                const bad = Object.keys(cfg).find(k => cfg[k] > available[k]); if (bad) return window.showToast(`Jumlah ${bad === 'PG_COMPLEX' ? 'PG Kompleks' : bad} melebihi soal yang tersedia (${available[bad]}).`, 'error');
                await window.FB.update(window.FB.ref(window.db, 'settings/questionComposition'), {[compositionKey(ch)]: cfg}); closeModal(); window.showToast('Komposisi soal berhasil disimpan.', 'success');
            };
            window.updateCompositionAvailability();
        };

        function initAdminQuestions() {
            window.FB.onValue(window.FB.ref(window.db, 'questions'), (snapshot) => {
                const tbody = document.getElementById('questions-tbody');
                if (!tbody) return;
                questionBankCache = snapshot.exists() ? snapshot.val() : {};
                const chapters = getChapterList(questionBankCache);
                const select = document.getElementById('question-chapter-filter');
                const current = select ? select.value : '__ALL__';
                if (select) {
                    select.innerHTML = `<option value="__ALL__">Semua Bab</option>` + chapters.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
                    select.value = chapters.includes(current) ? current : '__ALL__';
                }
                const total = document.getElementById('chapter-total-count');
                const totalBab = document.getElementById('chapter-total-bab');
                if (total) total.innerText = Object.keys(questionBankCache).length;
                if (totalBab) totalBab.innerText = chapters.length;
                window.filterQuestionBank();
            });
        }

        window.toggleCorrectAnswerInputs = function() {
            const type = document.getElementById('q-type').value;
            const optionSection = document.getElementById('question-options-section');
            const correctSection = document.getElementById('correct-answer-section');
            const pointsInput = document.getElementById('q-points');
            const manual = type === 'ISIAN' || type === 'ESSAY';
            optionSection.classList.toggle('hidden', manual);
            correctSection.classList.toggle('hidden', manual);
            pointsInput.value = type === 'PG' ? 1 : type === 'PG_COMPLEX' ? 2 : 1;
            pointsInput.disabled = type === 'PG' || type === 'PG_COMPLEX';
        };

        async function openQuestionModal(questionId = null) {
            let existing = null;
            if (questionId) {
                const snap = await window.FB.get(window.FB.ref(window.db, `questions/${questionId}`));
                if (!snap.exists()) { window.showToast('Soal tidak ditemukan.', 'error'); return; }
                existing = snap.val();
            }

            const modalContainer = document.getElementById('modal-container');
            const type = normalizeQuestionType(existing?.type || 'PG');
            const correctKeys = Object.keys(existing?.correctAnswers || {});
            const chapter = getQuestionChapter(existing || { chapter: '' });
            const chapterValue = chapter === 'Belum ditentukan' ? '' : chapter;
            const checked = key => correctKeys.includes(key) ? 'checked' : '';
            const title = existing ? 'Ubah Soal' : 'Tambah Soal Baru';
            const submitLabel = existing ? 'Simpan Perubahan' : 'Simpan Soal';

            modalContainer.querySelector('#modal-content').innerHTML = `
                <div class="p-6 max-h-[90vh] overflow-y-auto custom-scrollbar">
                    <h3 class="text-xl font-bold text-slate-900 mb-1">${title}</h3>
                    <p class="text-xs text-slate-500 mb-4">Tentukan bab agar soal masuk ke bank soal yang tepat dan bisa dipilih saat membuat ulangan.</p>
                    <form id="question-form" class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Bab</label>
                            <input type="text" id="q-chapter" list="question-chapter-options" value="${escapeHtml(chapterValue)}" required placeholder="Contoh: Bab 1 - Berpikir Komputasional" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 outline-none">
                            <datalist id="question-chapter-options"></datalist>
                            <p class="text-xs text-slate-500 mt-1">Boleh tulis nama bab baru. Gunakan nama yang konsisten, misalnya Bab 1, Bab 2, dan seterusnya.</p>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Tipe Soal</label>
                            <select id="q-type" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 bg-white" onchange="toggleCorrectAnswerInputs()">
                                <option value="PG" ${type === 'PG' ? 'selected' : ''}>Pilihan Ganda (1 Poin)</option>
                                <option value="PG_COMPLEX" ${type === 'PG_COMPLEX' ? 'selected' : ''}>Pilihan Ganda Kompleks (2 Poin)</option>
                                <option value="ISIAN" ${type === 'ISIAN' ? 'selected' : ''}>Isian (Dinilai Guru)</option>
                                <option value="ESSAY" ${type === 'ESSAY' ? 'selected' : ''}>Essay (Dinilai Guru)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Pertanyaan</label>
                            <textarea id="q-text" required rows="3" placeholder="Tuliskan pertanyaan..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 outline-none">${escapeHtml(existing?.question || '')}</textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Maksimal Poin</label>
                            <input type="number" id="q-points" min="1" step="0.01" value="${getQuestionMaxPoints(existing || { type })}" required class="w-full px-3 py-2.5 rounded-xl border border-slate-300">
                            <p class="text-xs text-slate-500 mt-1">PG otomatis 1, PG Kompleks otomatis 2. Untuk isian/essay guru menentukan bobot maksimal.</p>
                        </div>
                        <div id="question-options-section" class="grid grid-cols-2 gap-3">
                            <div><label class="block text-sm font-semibold text-slate-700 mb-1">Pilihan A</label><input type="text" id="opt-a" value="${escapeHtml(existing?.options?.A || '')}" class="w-full px-3 py-2 rounded-xl border border-slate-300"></div>
                            <div><label class="block text-sm font-semibold text-slate-700 mb-1">Pilihan B</label><input type="text" id="opt-b" value="${escapeHtml(existing?.options?.B || '')}" class="w-full px-3 py-2 rounded-xl border border-slate-300"></div>
                            <div><label class="block text-sm font-semibold text-slate-700 mb-1">Pilihan C</label><input type="text" id="opt-c" value="${escapeHtml(existing?.options?.C || '')}" class="w-full px-3 py-2 rounded-xl border border-slate-300"></div>
                            <div><label class="block text-sm font-semibold text-slate-700 mb-1">Pilihan D</label><input type="text" id="opt-d" value="${escapeHtml(existing?.options?.D || '')}" class="w-full px-3 py-2 rounded-xl border border-slate-300"></div>
                        </div>
                        <div id="correct-answer-section">
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Kunci Jawaban</label>
                            <div class="flex space-x-4 pt-1">
                                ${['A','B','C','D'].map(x => `<label class="flex items-center space-x-1 font-semibold"><input type="checkbox" name="correct-opt" value="${x}" ${checked(x)} class="h-4 w-4 text-brand-600"><span>${x}</span></label>`).join('')}
                            </div>
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl text-sm font-semibold">Batal</button>
                            <button type="submit" class="px-4 py-2 bg-brand-600 text-white rounded-xl text-sm font-semibold shadow-md">${submitLabel}</button>
                        </div>
                    </form>
                </div>`;
            modalContainer.classList.remove('hidden');

            const qSnap = await window.FB.get(window.FB.ref(window.db, 'questions'));
            const chapters = getChapterList(qSnap.exists() ? qSnap.val() : {});
            const dl = document.getElementById('question-chapter-options');
            if (dl) dl.innerHTML = chapters.filter(c => c !== 'Belum ditentukan').map(c => `<option value="${escapeHtml(c)}"></option>`).join('');
            toggleCorrectAnswerInputs();

            document.getElementById('question-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const chapter = document.getElementById('q-chapter').value.trim();
                const type = document.getElementById('q-type').value;
                const question = document.getElementById('q-text').value.trim();
                const points = type === 'PG' ? 1 : type === 'PG_COMPLEX' ? 2 : Math.max(1, Number(document.getElementById('q-points').value || 1));
                const checkedOpts = document.querySelectorAll('input[name="correct-opt"]:checked');

                if (!chapter) { window.showToast('Bab wajib diisi.', 'error'); return; }
                if (type === 'PG' && checkedOpts.length !== 1) { window.showToast('PG harus memiliki tepat 1 kunci.', 'error'); return; }
                if (type === 'PG_COMPLEX' && checkedOpts.length !== 2) { window.showToast('PG Kompleks harus memiliki tepat 2 kunci.', 'error'); return; }

                const options = type === 'PG' || type === 'PG_COMPLEX' ? {
                    A: document.getElementById('opt-a').value.trim(),
                    B: document.getElementById('opt-b').value.trim(),
                    C: document.getElementById('opt-c').value.trim(),
                    D: document.getElementById('opt-d').value.trim()
                } : {};
                const correctAnswers = {};
                checkedOpts.forEach(el => correctAnswers[el.value] = true);

                try {
                    const payload = {
                        chapter, type, question, options, correctAnswers, points,
                        active: existing?.active !== false, updatedAt: Date.now()
                    };
                    if (existing) {
                        await window.FB.update(window.FB.ref(window.db, `questions/${questionId}`), payload);
                    } else {
                        const newRef = window.FB.push(window.FB.ref(window.db, 'questions'));
                        await window.FB.set(newRef, { ...payload, createdAt: Date.now() });
                    }
                    closeModal();
                    window.showToast(existing ? 'Soal berhasil diperbarui!' : 'Soal berhasil ditambahkan!', 'success');
                } catch (err) {
                    window.showToast('Gagal menyimpan soal: ' + err.message, 'error');
                }
            });
        }


        // Tambah banyak soal sekaligus dalam satu BAB
        window.openBulkQuestionModal = async function() {

                  </div>
                  <div class="text-sm font-bold text-brand-700" id="bulk-count-summary"></div>
                  <div id="bulk-question-fields" class="space-y-4"></div>

                </form>
              </div>`;
            modalContainer.classList.remove('hidden');

              e.preventDefault();
              const chapter = document.getElementById('bulk-chapter').value.trim();
              if (!chapter) { window.showToast('BAB wajib diisi.','error'); return; }
              const items = [...document.querySelectorAll('[data-bulk-item]')];
              if (!items.length) { window.showToast('Isi minimal satu soal.','error'); return; }
              const payloads=[];
              for (const card of items) {
                const type=card.dataset.type;
                const question=card.querySelector('[data-qtext]').value.trim();
                if (!question) { window.showToast('Pertanyaan nomor '+card.dataset.index+' belum diisi.','error'); card.querySelector('[data-qtext]').focus(); return; }
                let options={}, correctAnswers={};
                if (type==='PG' || type==='PG_COMPLEX') {
                  for (const k of ['A','B','C','D']) options[k]=card.querySelector(`[data-opt="${k}"]`).value.trim();
                  const keys=[...card.querySelectorAll('[data-correct]:checked')].map(x=>x.value);
                  if (type==='PG' && keys.length!==1) { window.showToast('Soal PG nomor '+card.dataset.index+' harus memiliki 1 kunci.','error'); return; }
                  if (type==='PG_COMPLEX' && keys.length!==2) { window.showToast('Soal PG Kompleks nomor '+card.dataset.index+' harus memiliki 2 kunci.','error'); return; }
                  keys.forEach(k=>correctAnswers[k]=true);
                  if (Object.values(options).some(v=>!v)) { window.showToast('Lengkapi pilihan A-D pada soal nomor '+card.dataset.index+'.','error'); return; }
                }
                payloads.push({chapter,type,question,options,correctAnswers,points:type==='PG'?1:type==='PG_COMPLEX'?2:Math.max(1,Number(card.querySelector('[data-points]')?.value||1)),active:true,createdAt:Date.now(),updatedAt:Date.now()});
              }
              try {
                const root=window.FB.ref(window.db,'questions');
                for (const item of payloads) await window.FB.set(window.FB.push(root),item);
                closeModal(); window.showToast(payloads.length+' soal berhasil ditambahkan!','success');
              } catch(err) { window.showToast('Gagal menyimpan soal: '+err.message,'error'); }
            });
        };

          let global=0; let html='';

          box.innerHTML=html||'<p class="text-sm text-slate-500">Masukkan jumlah minimal 1 pada salah satu jenis soal untuk mulai mengisi.</p>';
        };

        let allResultsCache = {};

        function initAdminResults() {
            window.FB.onValue(window.FB.ref(window.db, 'examResults'), (snapshot) => {
                allResultsCache = {};
                if (snapshot.exists()) {
                    allResultsCache = snapshot.val();
                }
                // Firebase loads asynchronously; rebuild the class/BAB filters
                // every time results arrive so the dropdowns are populated.
                initResultsFilters();
                renderResultsTable();
            });

            document.getElementById('search-results-input').addEventListener('input', renderResultsTable);

            document.getElementById('results-chapter-filter').addEventListener('change', renderResultsTable);

        function initResultsFilters() {
            const classSelect = document.getElementById('results-class-filter');
            const chapterSelect = document.getElementById('results-chapter-filter');
            if (!classSelect || !chapterSelect) return;
            const classes = {};
            const chapters = new Set();
            // Prefer Master Kelas so the filter remains usable even before
            // a class has any exam result.
            uniqueActiveClasses(window.allClassesCache || {}).forEach(c => {
                if (c && c.name) classes[c.id] = c.name;
            });
            Object.values(allResultsCache || {}).forEach(r => {
                if (r?.classId && r?.className) classes[r.classId] = r.className;
                else if (r?.className) classes['name:' + r.className] = r.className;
                if (r?.examChapter) chapters.add(String(r.examChapter));
            });
            const oldClass = classSelect.value;
            const oldChapter = chapterSelect.value;
            classSelect.innerHTML = '<option value="">Semua Kelas</option>' + Object.entries(classes).sort((a,b)=>String(a[1]).localeCompare(String(b[1]),'id',{numeric:true})).map(([id,name])=>`<option value="${escapeHtml(id)}">${escapeHtml(name)}</option>`).join('');
            chapterSelect.innerHTML = '<option value="">Semua BAB</option>' + Array.from(chapters).sort((a,b)=>a.localeCompare(b,'id',{numeric:true})).map(ch=>`<option value="${escapeHtml(ch)}">${escapeHtml(ch)}</option>`).join('');
            if ([...classSelect.options].some(o=>o.value===oldClass)) classSelect.value=oldClass;
            if ([...chapterSelect.options].some(o=>o.value===oldChapter)) chapterSelect.value=oldChapter;
        }

        function renderResultsTable() {
            const tbody = document.getElementById('results-tbody');
            if (!tbody) return;
            tbody.innerHTML = '';

            const searchKey = document.getElementById('search-results-input').value.toLowerCase();
            const classFilter = document.getElementById('results-class-filter')?.value || '';
            const chapterFilter = document.getElementById('results-chapter-filter')?.value || '';
            const keys = Object.keys(allResultsCache);

            if (keys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="py-6 text-center text-slate-400">Belum ada hasil ujian.</td></tr>`;
                return;
            }

            let count = 0;
            keys.sort((a, b) => allResultsCache[b].submitTime - allResultsCache[a].submitTime).forEach(id => {
                const r = allResultsCache[id];
                const matchSearch = (r.studentName && r.studentName.toLowerCase().includes(searchKey)) || (r.nis && r.nis.toLowerCase().includes(searchKey)) || (r.examChapter && r.examChapter.toLowerCase().includes(searchKey));
                const matchClass = !classFilter || (classFilter.startsWith('name:') ? r.className === classFilter.slice(5) : r.classId === classFilter || (!r.classId && r.className === (document.querySelector('#results-class-filter option:checked')?.textContent || '')));
                const matchChapter = !chapterFilter || String(r.examChapter || '') === chapterFilter;

                if (matchSearch && matchClass && matchChapter) {
                    count++;
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="py-4 px-6 font-medium text-slate-700">${r.nis || '-'}</td>
                            <td class="py-4 px-6 font-bold text-slate-900">${r.studentName}</td>

                            <td class="py-4 px-6"><span class="px-2.5 py-1 bg-emerald-50 text-emerald-700 rounded-lg font-bold text-xs">${Number(r.finalScore || 0).toFixed(2)}</span></td>

                            </td>

                    `;
                }

        window.exportResultsExcel = function() {
            const classFilter = document.getElementById('results-class-filter')?.value || '';
            const chapterFilter = document.getElementById('results-chapter-filter')?.value || '';
            const classOptionText = document.querySelector('#results-class-filter option:checked')?.textContent || '';
            let dataToExport = [];
            Object.keys(allResultsCache).forEach(id => {
                const r = allResultsCache[id];
                const matchClass = !classFilter || (classFilter.startsWith('name:') ? r.className === classFilter.slice(5) : r.classId === classFilter || (!r.classId && r.className === classOptionText));
                const matchChapter = !chapterFilter || String(r.examChapter || '') === chapterFilter;
                if (!matchClass || !matchChapter) return;
                dataToExport.push({
                    'NIS': r.nis || '-',
                    'Nama Siswa': r.studentName,
                    'Kelas': r.className || '-',
                    'Bab': r.examChapter || 'Belum ditentukan',
                    'PG Benar': r.pgCorrect || 0,
                    'PG Kompleks Benar': r.pgComplexCorrect || 0,
                    'Poin Diperoleh': r.totalPoints || 0,
                    'Maksimal Poin': r.maxPoints || 0,
                    'Isian/Essay': r.manualCount ? (r.manualGraded ? 'Sudah dinilai' : 'Menunggu guru') : 'Tidak ada',
                    'Nilai Akhir': r.finalScore || 0,
                    'Tanggal Submit': new Date(r.submitTime || Date.now()).toLocaleString('id-ID')
                });
            });

            if (dataToExport.length === 0) {
                window.showToast('Tidak ada data hasil untuk diexport!', 'warning');
                return;
            }

            const worksheet = XLSX.utils.json_to_sheet(dataToExport);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Hasil Ujian");
            const safeClass = classOptionText && classFilter ? classOptionText.replace(/[^a-z0-9]+/gi,'_') : 'Semua_Kelas';
            const safeChapter = chapterFilter ? chapterFilter.replace(/[^a-z0-9]+/gi,'_') : 'Semua_BAB';
            XLSX.writeFile(workbook, `Hasil_Ujian_${safeClass}_${safeChapter}.xlsx`);
            window.showToast(`Berhasil export ${dataToExport.length} hasil ujian!`, 'success');
        };

        function renderAdminIntegrityLogs() {
            const rowsEl = document.getElementById('integrity-log-rows');

            if (!rowsEl || !summaryEl) return;
            const events = [];
            let sessionsWithEvents = 0;
            Object.entries(integritySessionsCache || {}).forEach(([sessionId, session]) => {
                const logs = session && session.integrityEvents ? Object.entries(session.integrityEvents) : [];
                if (logs.length) sessionsWithEvents++;
                logs.forEach(([eventId, ev]) => events.push({ sessionId, eventId, session, ...(ev || {}) }));
            });
            events.sort((a,b) => Number(b.timestamp || 0) - Number(a.timestamp || 0));
            summaryEl.innerHTML = `

        function initAdminExamStatus() {
            const classSelect = document.getElementById('exam-status-class');
            const resultsRef = window.FB.ref(window.db, 'examResults');
            const questionsRef = window.FB.ref(window.db, 'questions');
            const classesRef = window.FB.ref(window.db, 'classes');

            window.FB.onValue(resultsRef, snap => {
                examStatusResultsCache = snap.exists() ? snap.val() : {};
                renderExamStatusBySelection();
            });
            window.FB.onValue(questionsRef, snap => {
                examStatusQuestionsCache = snap.exists() ? snap.val() : {};
                renderExamStatusBySelection();
            });
            initExamStatusStudentsListener();
            window.FB.onValue(classesRef, snap => {
                examStatusClassesCache = snap.exists() ? snap.val() : {};
                const current = classSelect.value;
                const unique = uniqueActiveClasses(examStatusClassesCache);
                classSelect.innerHTML = `<option value="">Pilih kelas...</option>` + unique.map(c => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.name||c.id)}</option>`).join('');
                if (unique.some(c=>c.id===current)) classSelect.value=current;
                else if (unique.length) classSelect.value=unique[0].id;
                renderExamStatusBySelection();
            });
            classSelect.addEventListener('change', renderExamStatusBySelection);
        }

        function getStatusChapterList() {
            const set = new Set();
            Object.values(examStatusQuestionsCache || {}).forEach(q => {
                const ch = getQuestionChapter(q);
                if (ch && ch !== 'Belum ditentukan') set.add(ch);
            });
            Object.values(examStatusResultsCache || {}).forEach(r => {
                if (r && r.examChapter) set.add(String(r.examChapter));
            });
            return Array.from(set).sort((a,b)=>a.localeCompare(b,'id',{numeric:true,sensitivity:'base'}));
        }

        function renderExamStatusBySelection() {
            const select = document.getElementById('exam-status-class');
            const chaptersBox = document.getElementById('exam-status-chapters');
            const summary = document.getElementById('exam-status-summary');
            const detail = document.getElementById('exam-status-detail');
            if (!select || !chaptersBox) return;
            const classId = select.value;
            const className = classId && examStatusClassesCache[classId] ? examStatusClassesCache[classId].name : '-';
            if (!classId) {
                summary.innerHTML = '';
                chaptersBox.innerHTML = `<div class="md:col-span-2 xl:col-span-3 bg-white border border-slate-200 rounded-2xl p-8 text-center text-slate-400">Pilih kelas terlebih dahulu.</div>`;
                detail.innerHTML = '';
                return;
            }

            const results = Object.entries(examStatusResultsCache || {}).filter(([,r]) => r && (r.classId === classId || (r.classId === undefined && r.className === className)));
            const chapters = getStatusChapterList();
            const doneChapters = chapters.filter(ch => results.some(([,r]) => String(r.examChapter||'') === ch));
            const notDone = chapters.length - doneChapters.length;
            summary.innerHTML = `
                <div class="bg-white rounded-2xl border border-slate-200 p-5"><div class="text-xs text-slate-500 font-semibold">Kelas</div><div class="text-lg font-extrabold text-slate-900 mt-1">${escapeHtml(className)}</div></div>
                <div class="bg-emerald-50 rounded-2xl border border-emerald-100 p-5"><div class="text-xs text-emerald-600 font-semibold">BAB Sudah Ujian</div><div class="text-3xl font-extrabold text-emerald-700 mt-1">${doneChapters.length}</div></div>
                <div class="bg-amber-50 rounded-2xl border border-amber-100 p-5"><div class="text-xs text-amber-600 font-semibold">BAB Belum Ujian</div><div class="text-3xl font-extrabold text-amber-700 mt-1">${notDone}</div></div>`;

            if (!chapters.length) {
                chaptersBox.innerHTML = `<div class="md:col-span-2 xl:col-span-3 bg-white border border-slate-200 rounded-2xl p-8 text-center text-slate-400">Belum ada BAB pada bank soal.</div>`;
                detail.innerHTML=''; return;
            }
            chaptersBox.innerHTML = chapters.map(ch => {
                const chapterResults = results.filter(([,r])=>String(r.examChapter||'')===ch);
                const students = new Set(chapterResults.map(([,r])=>String(r.studentId || r.nis || ''))).size;
                const done = chapterResults.length > 0;
                return `<button onclick="showExamStatusDetail('${escapeHtml(classId)}', '${escapeHtml(ch).replace(/'/g,"&#39;")}')" class="text-left bg-white rounded-2xl border ${done?'border-emerald-200':'border-slate-200'} shadow-sm p-5 hover:shadow-md hover:-translate-y-0.5 transition group">

                    <h3 class="font-extrabold text-slate-900 mt-4">${escapeHtml(ch)}</h3><p class="text-sm text-slate-500 mt-1">${done?`${students} siswa sudah mengerjakan`:'Belum ada siswa yang mengerjakan'}</p><div class="text-xs font-semibold text-brand-600 mt-4">Klik untuk lihat rekap <i class="fa-solid fa-arrow-right ml-1"></i></div>
                </button>`;
            }).join('');
            detail.innerHTML = `<div class="bg-white rounded-2xl border border-slate-200 p-5 text-sm text-slate-500">Pilih salah satu BAB di atas untuk melihat daftar siswa yang sudah dan belum ujian.</div>`;
        }

        window.showExamStatusDetail = function(classId, chapter) {
            const box = document.getElementById('exam-status-detail');
            if (!box) return;
            const className = examStatusClassesCache[classId]?.name || '-';
            const students = Object.entries(examStatusStudentsCache || {}).filter(([,s])=>s && s.classId===classId);
            const results = Object.values(examStatusResultsCache || {}).filter(r=>r && (r.classId===classId || (r.classId===undefined && r.className===className)) && String(r.examChapter||'')===chapter);
            const byStudent = {};
            results.forEach(r=>{ byStudent[r.studentId || r.nis] = r; });
            const rows = students.map(([id,s])=>{
                const r=byStudent[id] || byStudent[s.nis];
                return `<tr><td class="py-3 px-4 font-semibold">${escapeHtml(s.nis||'-')}</td><td class="py-3 px-4 font-bold">${escapeHtml(s.name||'-')}</td><td class="py-3 px-4">${r?'<span class="px-2 py-1 bg-emerald-50 text-emerald-700 rounded-lg text-xs font-bold">Sudah Ujian</span>':'<span class="px-2 py-1 bg-amber-50 text-amber-700 rounded-lg text-xs font-bold">Belum Ujian</span>'}</td><td class="py-3 px-4">${r?Number(r.finalScore||0).toFixed(2):'-'}</td><td class="py-3 px-4 text-right">${r?`<button onclick="router.navigate('admin-result-detail',{resultId:'${Object.keys(examStatusResultsCache).find(k=>examStatusResultsCache[k]===r)||''}',sessionId:'${r.sessionId||''}'})" class="px-3 py-1.5 bg-brand-50 text-brand-700 rounded-lg text-xs font-semibold">Detail</button>`:'-'}</td></tr>`;

            box.innerHTML=`<div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden"><div class="p-5 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3"><div><h3 class="font-extrabold text-slate-900">${escapeHtml(chapter)}</h3><p class="text-sm text-slate-500 mt-1">${escapeHtml(className)} — status setiap siswa</p></div><button onclick="exportExamStatusExcel('${escapeHtml(classId)}','${escapeHtml(chapter).replace(/'/g,"&#39;")}')" class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-sm font-semibold"><i class="fa-solid fa-file-excel mr-1"></i> Export BAB Ini</button></div><div class="overflow-x-auto"><table class="w-full text-left"><thead class="bg-slate-50 text-xs text-slate-500 uppercase"><tr><th class="py-3 px-4">NIS</th><th class="py-3 px-4">Nama</th><th class="py-3 px-4">Status</th><th class="py-3 px-4">Nilai</th><th class="py-3 px-4 text-right">Aksi</th></tr></thead><tbody class="divide-y divide-slate-100 text-sm">${rows || `<tr><td colspan="5" class="py-6 text-center text-slate-400">Belum ada siswa di kelas ini.</td></tr>`}</tbody></table></div></div>`;
        };

        let examStatusStudentsCache = {};
        function initExamStatusStudentsListener() {
            window.FB.onValue(window.FB.ref(window.db, 'students'), snap => { examStatusStudentsCache = snap.exists()?snap.val():{}; renderExamStatusBySelection(); });
        }

        window.exportExamStatusExcel = function(classId, chapter) {
            const className = examStatusClassesCache[classId]?.name || '-';
            const students = Object.entries(examStatusStudentsCache || {}).filter(([,s]) => s && s.classId === classId);
            const resultEntries = Object.entries(examStatusResultsCache || {}).filter(([,r]) => r && (r.classId === classId || (r.classId === undefined && r.className === className)) && String(r.examChapter || '') === chapter);
            const byStudent = {};
            resultEntries.forEach(([id,r]) => { byStudent[r.studentId || r.nis] = {id,r}; });
            const data = students.map(([id,s]) => {
                const found = byStudent[id] || byStudent[s.nis];
                const r = found?.r;
                return {
                    'Kelas': className,
                    'BAB': chapter,
                    'NIS': s.nis || '-',
                    'Nama Siswa': s.name || '-',
                    'Status': r ? 'Sudah Ujian' : 'Belum Ujian',
                    'Nilai Akhir': r ? Number(r.finalScore || 0) : '',
                    'Tanggal Submit': r ? new Date(r.submitTime || Date.now()).toLocaleString('id-ID') : ''
                };
            });
            if (!data.length) { window.showToast('Tidak ada data siswa untuk diexport!', 'warning'); return; }
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Status Ujian');
            const safeClass = className.replace(/[^a-z0-9]+/gi,'_');
            const safeChapter = chapter.replace(/[^a-z0-9]+/gi,'_');
            XLSX.writeFile(wb, `Status_Ujian_${safeClass}_${safeChapter}.xlsx`);
            window.showToast(`Status ${className} - ${chapter} berhasil diexport!`, 'success');
        };

        async function initAdminResultDetail(params) {
            window.showLoading(true, "Memuat jawaban siswa...");
            try {
                const rSnap = await window.FB.get(window.FB.ref(window.db, `examResults/${params.resultId}`));
                if (!rSnap.exists()) throw new Error("Hasil tidak ditemukan.");
                const resData = rSnap.val();

                const sessSnap = await window.FB.get(window.FB.ref(window.db, `examSessions/${resData.sessionId}`));
                if (!sessSnap.exists()) throw new Error("Sesi ulangan tidak ditemukan.");
                const sessData = sessSnap.val();

                const qSnap = await window.FB.get(window.FB.ref(window.db, 'questions'));
                const allQuestions = qSnap.val() || {};
                const questionIds = sessData.questionIds || [];
                const questionMap = sessData.questionMap || {};
                const studentAnswers = sessData.answers || {};
                const manualScores = resData.manualScores || {};

                document.getElementById('detail-name').innerText = resData.studentName || '-';
                document.getElementById('detail-class').innerText = `${resData.className || '-'} (NIS: ${resData.nis || '-'})`;
                document.getElementById('detail-score').innerText = Number(resData.finalScore || 0).toFixed(2);
                document.getElementById('detail-final-score').innerText = Number(resData.finalScore || 0).toFixed(2);

                const container = document.getElementById('detail-questions-container');
                container.innerHTML = '';

                questionIds.forEach((qId, idx) => {
                    const qMeta = questionMap[qId];
                    const qRaw = allQuestions[qId];
                    if (!qRaw || !qMeta) return;

                    const type = normalizeQuestionType(qMeta.type);
                    const max = Number(qMeta.maxPoints || getQuestionMaxPoints(qRaw));
                    const ans = studentAnswers[qId];
                    let answerText = 'Tidak dijawab';
                    let earned = 0;
                    let keyText = '-';

                    if (type === 'PG') {
                        answerText = ans ? `${ans}. ${(qMeta.shuffledOptions || {})[ans] || ''}` : 'Tidak dijawab';
                        const ck = Object.keys(qMeta.shuffledCorrectAnswers || {})[0];
                        keyText = ck ? `${ck}. ${(qMeta.shuffledOptions || {})[ck] || ''}` : '-';
                        earned = ans && qMeta.shuffledCorrectAnswers && qMeta.shuffledCorrectAnswers[ans] ? 1 : 0;
                    } else if (type === 'PG_COMPLEX') {
                        const arr = Array.isArray(ans) ? ans : [];
                        answerText = arr.length ? arr.map(k => `${k}. ${(qMeta.shuffledOptions || {})[k] || ''}`).join(', ') : 'Tidak dijawab';
                        keyText = Object.keys(qMeta.shuffledCorrectAnswers || {}).map(k => `${k}. ${(qMeta.shuffledOptions || {})[k] || ''}`).join(', ');
                        const a = [...arr].sort(), c = Object.keys(qMeta.shuffledCorrectAnswers || {}).sort();
                        earned = a.length === c.length && a.every((v,i)=>v===c[i]) ? 2 : 0;
                    } else {
                        answerText = ans ? String(ans) : 'Tidak dijawab';
                        earned = Number(manualScores[qId] || 0);
                    }

                    const manual = type === 'ISIAN' || type === 'ESSAY';
                    container.innerHTML += `
                        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
                            <div class="flex items-center justify-between mb-3">
                                <span class="font-bold text-slate-800">Soal ${idx + 1} — ${type}</span>
                                <span class="px-3 py-1 rounded-lg text-xs font-bold bg-slate-100 text-slate-700">
                                    Maksimal ${max} poin
                                </span>
                            </div>
                            <p class="text-slate-900 font-medium mb-4">${qRaw.question}</p>
                            <div class="bg-slate-50 p-4 rounded-xl space-y-3 text-sm border border-slate-200">
                                <div><span class="font-semibold text-slate-500 block mb-1">Jawaban Siswa</span><div class="font-semibold text-slate-800 whitespace-pre-wrap">${answerText}</div></div>
                                <div><span class="font-semibold text-slate-500 block mb-1">Kunci / Jawaban Benar</span><div class="font-semibold text-emerald-600 whitespace-pre-wrap">${keyText}</div></div>
                                ${manual ? `
                                    <div class="pt-3 border-t border-slate-200">
                                        <label class="font-semibold text-slate-700">Nilai Guru (0–${max})</label>
                                        <input type="number" min="0" max="${max}" step="0.01"
                                            data-grade-qid="${qId}" value="${earned}"
                                            class="manual-grade-input mt-2 w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 outline-none">
                                    </div>` : `
                                    <div class="pt-2 border-t border-slate-200 font-bold ${earned > 0 ? 'text-emerald-600' : 'text-rose-600'}">
                                        Poin otomatis: ${earned} / ${max}
                                    </div>`}
                            </div>
                        </div>
                    `;
                });

                document.getElementById('save-manual-grades-btn').onclick = async () => {
                    window.showLoading(true, "Menyimpan nilai guru...");
                    try {
                        const manualScoresNew = {};
                        document.querySelectorAll('.manual-grade-input').forEach(input => {
                            const qId = input.dataset.gradeQid;
                            const max = Number(input.max || 0);
                            let val = Number(input.value || 0);
                            if (val < 0) val = 0;
                            if (val > max) val = max;
                            manualScoresNew[qId] = Number(val.toFixed(2));
                        });

                        let earnedTotal = 0, maxTotal = 0;
                        questionIds.forEach(qId => {
                            const qm = questionMap[qId];
                            const raw = allQuestions[qId];
                            if (!qm || !raw) return;
                            const type = normalizeQuestionType(qm.type);
                            const max = Number(qm.maxPoints || getQuestionMaxPoints(raw));
                            maxTotal += max;

                            if (type === 'PG') {
                                const a = studentAnswers[qId];
                                if (a && qm.shuffledCorrectAnswers && qm.shuffledCorrectAnswers[a]) earnedTotal += 1;
                            } else if (type === 'PG_COMPLEX') {
                                const a = Array.isArray(studentAnswers[qId]) ? [...studentAnswers[qId]].sort() : [];
                                const c = Object.keys(qm.shuffledCorrectAnswers || {}).sort();
                                if (a.length === c.length && a.every((v,i)=>v===c[i])) earnedTotal += 2;
                            } else {
                                earnedTotal += Number(manualScoresNew[qId] || 0);
                            }
                        });

                        const finalScore = maxTotal ? Number(((earnedTotal / maxTotal) * 100).toFixed(2)) : 0;
                        await window.FB.update(window.FB.ref(window.db, `examResults/${params.resultId}`), {
                            manualScores: manualScoresNew,
                            manualEarned: Number((earnedTotal - Number(resData.autoPoints || 0)).toFixed(2)),
                            totalPoints: Number(earnedTotal.toFixed(2)),
                            maxPoints: maxTotal,
                            finalScore,
                            manualGraded: true,
                            gradedAt: Date.now()
                        });
                        await window.FB.update(window.FB.ref(window.db, `examSessions/${resData.sessionId}`), {
                            totalPoints: Number(earnedTotal.toFixed(2)),
                            maxPoints: maxTotal,
                            finalScore
                        });
                        await window.FB.set(window.FB.push(window.FB.ref(window.db, `examHistory/${resData.studentId}`)), {
                            resultId: params.resultId,
                            totalPoints: Number(earnedTotal.toFixed(2)),
                            maxPoints: maxTotal,
                            finalScore,
                            submitTime: Date.now(),
                            type: 'manual_grading'
                        });

                        document.getElementById('detail-score').innerText = finalScore.toFixed(2);
                        document.getElementById('detail-final-score').innerText = finalScore.toFixed(2);
                        window.showLoading(false);
                        window.showToast('Nilai isian dan essay berhasil disimpan.', 'success');
                    } catch (err) {
                        window.showLoading(false);
                        window.showToast('Gagal menyimpan nilai: ' + err.message, 'error');
                    }
                };

                window.showLoading(false);
            } catch (err) {
                window.showLoading(false);
                console.error(err);
                window.showToast(err.message, 'error');
                router.navigate('admin-results');
            }
        }

        function normalizeContentType(type) {
            return String(type || '').toUpperCase().trim();

        async function getAllLearningData() {
            const [qSnap, mSnap, pSnap, gSnap] = await Promise.all([
                window.FB.get(window.FB.ref(window.db, 'questions')),
                window.FB.get(window.FB.ref(window.db, 'materials')),
                window.FB.get(window.FB.ref(window.db, 'practiceQuestions')),
                window.FB.get(window.FB.ref(window.db, 'games'))
            ]);
            return {
                questions: qSnap.exists() ? qSnap.val() : {},
                materials: mSnap.exists() ? mSnap.val() : {},
                practice: pSnap.exists() ? pSnap.val() : {},
                games: gSnap.exists() ? gSnap.val() : {}
            };
        }

        function getLearningChapterList(data) {
            const set = new Set();
            Object.values(data.questions || {}).forEach(q => {
                const c = getQuestionChapter(q);
                if (c) set.add(c);
            });
            ['materials','practice','games'].forEach(k => {
                Object.values(data[k] || {}).forEach(x => {
                    if (x.chapter) set.add(String(x.chapter).trim());
                });
            });
            return Array.from(set).sort((a,b) => a.localeCompare(b, 'id', {numeric:true, sensitivity:'base'}));
        }

        async function getActiveClassList() {
            const snap = await window.FB.get(window.FB.ref(window.db, 'classes'));

            return uniqueActiveClasses(data).map(c => ({ id: c.id, name: String(c.name || c.id) }));

        function learningClassSelect(id, classes, selectedId='', selectedName='') {
            let selected = selectedId || '';

        async function initStudentLearningLogin() {
            const form = document.getElementById('student-learning-login-form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const nis = document.getElementById('learning-nis').value.trim();
                const target = router.params?.target || 'materials';
                window.showLoading(true, 'Memeriksa NIS...');
                try {
                    const snap = await window.FB.get(window.FB.ref(window.db, 'students'));
                    if (!snap.exists()) throw new Error('Data siswa belum tersedia.');
                    const students = snap.val();

                    // Master Kelas menjadi sumber nama kelas terbaru.
                    const classSnap = await window.FB.get(window.FB.ref(window.db, 'classes'));
                    const classes = classSnap.exists() ? classSnap.val() : {};

                    let found = null;
                    Object.entries(students).some(([id, st]) => {
                        if (st && st.active !== false && String(st.nis || '').trim() === nis) {
                            const classId = st.classId || '';
                            const liveClassName = classId && classes[classId]
                                ? (classes[classId].name || '-')
                                : (st.className || '-');
                            found = {
                                id,
                                nis: String(st.nis || '').trim(),
                                name: st.name || '-',
                                classId,
                                className: liveClassName
                            };
                            return true;
                        }
                        return false;
                    });
                    if (!found) throw new Error('NIS tidak ditemukan.');
                    if (!found.classId && !found.className) throw new Error('Kelas siswa belum ditentukan oleh guru.');
                    setLearningStudent(found);
                    window.showLoading(false);
                    const route = target === 'practice' ? 'student-practice' : target === 'games' ? 'student-games' : 'student-materials';
                    router.navigate(route);
                } catch (err) {
                    window.showLoading(false);
                    window.showToast(err.message || 'Gagal masuk.', 'error');
                }
            });
        }

        window.toggleLearningExternal = function(){
            const external=document.getElementById('lm-external')?.checked;

        window.saveLearningItem = async function(kind,id='') {
            try{
                const chapter=document.getElementById('lm-chapter')?.value.trim();
                const classId=document.getElementById('lm-class')?.value.trim();
                if(!classId){window.showToast('Pilih kelas terlebih dahulu.','error');return;}
                if(!chapter){window.showToast('Pilih BAB terlebih dahulu.','error');return;}
                const paths={material:'materials',practice:'practiceQuestions',game:'games'}, path=paths[kind];
                const classes=await getActiveClassList();
                const cls=classes.find(c=>c.id===classId);
                let data={chapter,classId,className:cls?.name||'',active:true,updatedAt:Date.now()};
                if(kind==='material'){
                    const title=document.getElementById('lm-title').value.trim();
                    const link=document.getElementById('lm-link').value.trim();
                    if(!title || !link){window.showToast('Isi judul dan tempel link Canva/materi terlebih dahulu.','error');return;}
                    data={...data,title,type:'LINK',summary:'',content:'',link,externalLink:true};
                }else{
                    const external=document.getElementById('lm-external')?.checked;
                    const title=document.getElementById('lm-title').value.trim();
                    if(!title){window.showToast('Judul wajib diisi.','error');return;}
                    if(external){
                        const link=document.getElementById('lm-link')?.value.trim();
                        if(!link){window.showToast('Tempel link Canva/latihan/games terlebih dahulu.','error');return;}
                        data={...data,title,externalLink:true,link,type:'EXTERNAL',points:0};
                    }else{
                        const question=document.getElementById('lm-question').value.trim();
                        const type=document.getElementById('lm-type').value;
                        const correct=document.getElementById('lm-correct').value.split(',').map(x=>x.trim().toUpperCase()).filter(x=>['A','B','C','D'].includes(x));
                        if(!question||correct.length!== (type==='PG_COMPLEX'?2:1)){window.showToast(type==='PG_COMPLEX'?'PG Kompleks harus punya tepat 2 jawaban benar.':'Pilih tepat 1 jawaban benar.','error');return;}
                        const options={};['A','B','C','D'].forEach(k=>options[k]=document.getElementById('lm-opt-'+k).value.trim());
                        if(Object.values(options).some(v=>!v)){window.showToast('Semua pilihan A-D wajib diisi.','error');return;}
                        data={...data,title,type,question,options,correctAnswers:Object.fromEntries(correct.map(k=>[k,true])),explanation:document.getElementById('lm-explanation').value.trim(),points:type==='PG_COMPLEX'?2:1,externalLink:false};
                    }
                }
                if(id) await window.FB.update(window.FB.ref(window.db,`${path}/${id}`),data);
                else { data.createdAt=Date.now(); await window.FB.set(window.FB.push(window.FB.ref(window.db,path)),data); }
                document.getElementById('learning-modal')?.remove();window.showToast('Data berhasil disimpan.','success');
                if(kind==='material')renderAdminMaterialsList(); else if(kind==='practice')renderAdminPracticeList(); else renderAdminGamesList();
            }catch(err){console.error(err);window.showToast('Gagal menyimpan: '+err.message,'error');}
        };

        window.deleteLearningItem=async function(path,id){

        };

        // --- PORTAL MATERI / LATIHAN / GAMES SISWA ---
        function studentClassMatches(item, student) {
            if (!item || !student) return false;
            if (item.classId) return String(item.classId) === String(student.classId);
            if (item.className && student.className) return String(item.className).trim().toLowerCase() === String(student.className).trim().toLowerCase();
            return false; // data lama tanpa kelas tidak dicampurkan ke kelas baru
        }

        window.loadPracticeChapter=async function(chapter){

        async function initAdminSettings() {
            window.showLoading(true, "Memuat pengaturan...");
            try {
                const [settingsSnap, questionsSnap, classesSnap] = await Promise.all([
                    window.FB.get(window.FB.ref(window.db, 'settings')),
                    window.FB.get(window.FB.ref(window.db, 'questions')),
                    window.FB.get(window.FB.ref(window.db, 'classes'))
                ]);
                const settings = settingsSnap.exists() ? settingsSnap.val() : {};
                const questions = questionsSnap.exists() ? questionsSnap.val() : {};
                const classesData = classesSnap.exists() ? classesSnap.val() : {};
                const activeClasses = uniqueActiveClasses(classesData).map(c => [c.id, c]);
                const classSelect = document.getElementById('set-class');
                if (classSelect) {
                    classSelect.innerHTML = activeClasses.length
                        ? `<option value="">-- Pilih Kelas yang Akan Diujikan --</option>` + activeClasses.map(([id, c]) => `<option value="${escapeHtml(id)}">${escapeHtml(c.name || id)}</option>`).join('')
                        : '<option value="">Belum ada kelas aktif</option>';
                    if (settings.examClassId && activeClasses.some(([id]) => id === settings.examClassId)) {
                        classSelect.value = settings.examClassId;
                    } else if (settings.examClassName) {
                        const match = activeClasses.find(([, c]) => String(c.name || '').trim().toLowerCase() === String(settings.examClassName).trim().toLowerCase());
                        if (match) classSelect.value = match[0];
                    }
                }
                const classInfo = document.getElementById('class-settings-info');
                if (classInfo) classInfo.innerText = activeClasses.length
                    ? `${activeClasses.length} kelas aktif tersedia. Hanya siswa dari kelas yang dipilih yang dapat mengikuti ulangan.`
                    : 'Belum ada kelas aktif. Tambahkan kelas terlebih dahulu.';
                const chapters = getChapterList(questions);
                const select = document.getElementById('set-chapter');
                if (select) {
                    select.innerHTML = chapters.length
                        ? `<option value="">-- Pilih Bab yang Akan Diujikan --</option>` + chapters.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')
                        : '<option value="">Belum ada bab</option>';
                    if (settings.examChapter && chapters.includes(settings.examChapter)) select.value = settings.examChapter;
                }
                document.getElementById('set-title').value = settings.examTitle || 'Ulangan Harian';
                document.getElementById('set-duration').value = settings.examDuration || 60;
                document.getElementById('set-token').value = settings.examToken || '';
                document.getElementById('set-active').checked = settings.examActive !== false;
                const info = document.getElementById('chapter-settings-info');
                if (info) info.innerText = chapters.length ? `${chapters.length} bab tersedia. Siswa hanya mendapat soal dari bab yang dipilih.` : 'Belum ada bab. Tambahkan soal dan tentukan bab terlebih dahulu.';
                window.showLoading(false);
            } catch (err) {
                window.showLoading(false);
                window.showToast('Gagal memuat pengaturan.', 'error');
            }

            document.getElementById('settings-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                try {
                    const classSelect = document.getElementById('set-class');
                    const selectedClassId = classSelect ? classSelect.value.trim() : '';
                    const selectedClassName = classSelect && classSelect.selectedIndex >= 0
                        ? String(classSelect.options[classSelect.selectedIndex]?.textContent || '').trim()
                        : '';
                    if (!selectedClassId) { window.showToast('Pilih kelas yang akan diujikan terlebih dahulu.', 'error'); return; }

                    const selectedChapter = document.getElementById('set-chapter').value.trim();
                    if (!selectedChapter) { window.showToast('Pilih bab yang akan diujikan terlebih dahulu.', 'error'); return; }
                    const qSnap = await window.FB.get(window.FB.ref(window.db, 'questions'));
                    const questions = qSnap.exists() ? qSnap.val() : {};
                    const chapterQuestions = Object.values(questions).filter(q => q.active !== false && getQuestionChapter(q) === selectedChapter);
                    if (!chapterQuestions.length) { window.showToast(`Belum ada soal aktif untuk ${selectedChapter}.`, 'error'); return; }
                    await window.FB.update(window.FB.ref(window.db, 'settings'), {
                        examTitle: document.getElementById('set-title').value.trim(),
                        examClassId: selectedClassId,
                        examClassName: selectedClassName,
                        examChapter: selectedChapter,
                        examDuration: parseInt(document.getElementById('set-duration').value) || 60,
                        examToken: document.getElementById('set-token').value.trim().toUpperCase(),
                        examActive: document.getElementById('set-active').checked,
                        showStudentResult: true
                    });
                    window.showToast(`Pengaturan disimpan. Kelas ${selectedClassName} akan mengikuti ${selectedChapter}.`, 'success');
                } catch (err) {
                    window.showToast('Gagal menyimpan pengaturan: ' + err.message, 'error');
                }
            });
            await initExamSchedulePanel();
        }

        async function initExamSchedulePanel() {
            const form = document.getElementById('exam-schedule-form');
            if (!form || form.dataset.bound === '1') return;
            form.dataset.bound = '1';
            const [classesSnap, questionsSnap] = await Promise.all([
                window.FB.get(window.FB.ref(window.db, 'classes')),
                window.FB.get(window.FB.ref(window.db, 'questions'))
            ]);
            const classes = uniqueActiveClasses(classesSnap.exists() ? classesSnap.val() : {});
            const chapters = getChapterList(questionsSnap.exists() ? questionsSnap.val() : {});
            document.getElementById('sched-class').innerHTML = classes.map(c => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.name || c.id)}</option>`).join('') || '<option value="">Belum ada kelas</option>';
            document.getElementById('sched-chapter').innerHTML = chapters.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('') || '<option value="">Belum ada bab</option>';
            const refreshList = async () => {
                const snap = await window.FB.get(window.FB.ref(window.db, 'examSchedules'));
                const data = snap.exists() ? snap.val() : {};
                const entries = Object.entries(data).sort((a,b) => String(a[1].startAt||'').localeCompare(String(b[1].startAt||'')));
                const box = document.getElementById('exam-schedule-list');
                if (!entries.length) { box.innerHTML = '<p class="text-slate-400">Belum ada jadwal sesi.</p>'; return; }
                box.innerHTML = entries.map(([id,x]) => `<div class="p-4 rounded-xl border ${x.active ? 'border-indigo-100 bg-indigo-50' : 'border-slate-200 bg-slate-50'}"><div class="font-bold">${escapeHtml(x.title || 'Ulangan')} · ${escapeHtml(x.className || '-')}</div><div class="text-slate-600 mt-1">${escapeHtml(x.chapter || '-')} · ${escapeHtml(x.startAt || '-').replace('T',' ')} sampai ${escapeHtml(x.endAt || '-').replace('T',' ')}</div><div class="mt-2 flex flex-wrap items-center gap-2"><span class="px-3 py-1 bg-white rounded-lg border font-extrabold tracking-widest">${escapeHtml(x.token || '-')}</span><span class="text-xs ${x.active ? 'text-emerald-700' : 'text-slate-500'}">${x.active ? 'Aktif' : 'Nonaktif'}</span><button type="button" onclick="toggleExamSchedule('${id}',${!x.active})" class="px-3 py-1 rounded-lg border bg-white font-semibold">${x.active ? 'Nonaktifkan' : 'Aktifkan'}</button><button type="button" onclick="deleteExamSchedule('${id}')" class="px-3 py-1 rounded-lg border border-rose-200 text-rose-700 bg-white font-semibold">Hapus</button></div></div>`).join('');
            };
            form.addEventListener('submit', async e => {
                e.preventDefault();
                const classId = document.getElementById('sched-class').value;
                const className = document.getElementById('sched-class').selectedOptions[0]?.textContent || '';
                const chapter = document.getElementById('sched-chapter').value;
                const startAt = document.getElementById('sched-start').value;
                const endAt = document.getElementById('sched-end').value;
                if (!classId || !chapter) return window.showToast('Pilih kelas dan bab terlebih dahulu.', 'error');
                if (!startAt || !endAt || new Date(endAt) <= new Date(startAt)) return window.showToast('Waktu selesai harus setelah waktu mulai.', 'error');
                const qSnap = await window.FB.get(window.FB.ref(window.db, 'questions'));
                const qs = qSnap.exists() ? qSnap.val() : {};
                if (!Object.values(qs).some(q => q.active !== false && getQuestionChapter(q) === chapter)) return window.showToast('Belum ada soal aktif untuk bab tersebut.', 'error');
                const token = 'GAMA' + Math.floor(100000 + Math.random() * 900000);
                const id = 'schedule_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
                const schedule = { title: document.getElementById('sched-title').value.trim(), classId, className, chapter, startAt, endAt, duration: parseInt(document.getElementById('sched-duration').value,10)||10, token, active: document.getElementById('sched-active').checked, createdAt: new Date().toISOString() };
                await window.FB.set(window.FB.ref(window.db, 'examSchedules/' + id), schedule);
                window.showToast('Jadwal tersimpan dan token dibuat otomatis.', 'success');
                form.reset(); document.getElementById('sched-duration').value = 10; document.getElementById('sched-active').checked = true;
                await refreshList();
            });
            window.refreshExamScheduleList = refreshList;
            await refreshList();
        }
        window.toggleExamSchedule = async function(id, active) {
            await window.FB.update(window.FB.ref(window.db, 'examSchedules/' + id), {active});
            await window.refreshExamScheduleList?.();
            window.showToast(active ? 'Jadwal diaktifkan.' : 'Jadwal dinonaktifkan.', 'success');
        };
        window.deleteExamSchedule = async function(id) {
            if (!confirm('Hapus jadwal ini?')) return;
            await window.FB.set(window.FB.ref(window.db, 'examSchedules/' + id), null);
            await window.refreshExamScheduleList?.();
            window.showToast('Jadwal dihapus.', 'success');
        };

        window.generateExamToken = async function() {
            const token = 'GAMA' + Math.floor(1000 + Math.random() * 9000);
            document.getElementById('set-token').value = token;
            try {
                await window.FB.update(window.FB.ref(window.db, 'settings'), { examToken: token });
                window.showToast('Token baru berhasil dibuat: ' + token, 'success');
            } catch (err) {
                window.showToast('Token gagal disimpan.', 'error');
            }
        };

        // Saat aplikasi dibuka, tampilkan Beranda terlebih dahulu.
        // Sesi admin yang tertinggal tidak boleh langsung membuka panel admin di komputer bersama.
        // Siswa yang sedang mengerjakan ujian tetap dapat melanjutkan sesi setelah refresh.
        window.onload = async function() {
            try {
                await window.FB.setPersistence(window.auth, window.FB.browserLocalPersistence);
            } catch (e) {
                console.warn('Persistence auth tidak dapat diatur:', e);
            }

            let handlingAuthChange = false;
            let initialAuthStateHandled = false;
            window.auth.onAuthStateChanged(async (user) => {
                // Pemeriksaan ini hanya untuk keadaan saat aplikasi pertama kali dibuka.
                // Jangan menjalankan logika logout saat admin baru saja berhasil login.
                if (handlingAuthChange || initialAuthStateHandled) return;
                initialAuthStateHandled = true;

                // Pulihkan ujian siswa yang masih aktif terlebih dahulu.
                const activeSessionId = localStorage.getItem('gamaSchoolActiveSession');
                if (activeSessionId) {
                    try {
                        const snap = await window.FB.get(window.FB.ref(window.db, `examSessions/${activeSessionId}`));
                        if (snap.exists() && snap.val().status === 'active') {
                            router.navigate('exam', { sessionId: activeSessionId, studentId: snap.val().studentId });
                            return;
                        }
                        localStorage.removeItem('gamaSchoolActiveSession');
                    } catch (e) {
                        console.error('Gagal memulihkan sesi ujian:', e);
                        // Jika pemeriksaan gagal, jangan membuka panel admin otomatis.
                        router.navigate('home');
                        return;
                    }
                }

                // Jika ada sesi Firebase yang tersimpan, keluarkan saat aplikasi dibuka ulang.
                // Admin harus login kembali secara eksplisit dari tombol Admin Login.
                if (user && !user.isAnonymous) {
                    handlingAuthChange = true;
                    try {
                        await window.FB.signOut(window.auth);
                    } catch (e) {
                        console.warn('Tidak dapat mengakhiri sesi lama:', e);
                    } finally {
                        handlingAuthChange = false;
                    }
                }

                localStorage.removeItem('gamaSchoolAdminRoute');
                router.navigate('home');
            });
        };
    </script>
</body>
</html>
