        // Toast Notification Function
        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg text-sm font-medium text-white flex items-center space-x-2 transform translate-y-2 opacity-0 transition-all duration-300 ${
                type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-amber-600'
            }`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-triangle-exclamation'} text-base"></i>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        };

        window.showLoading = function(show, text = "Memproses...") {
            const loader = document.getElementById('loading-overlay');
            document.getElementById('loading-text').innerText = text;
            if(show) loader.classList.remove('hidden');
            else loader.classList.add('hidden');
        };

                        { type: 'PG', question: 'Perhatikan empat metode utama dalam berpikir komputasional: (1) Algoritma, (2) Dekomposisi, (3) Pengenalan pola, (4) Abstraksi. Saat seorang siswa merapikan kamar dengan cara membersihkan meja, merapikan tempat tidur, dan menyapu lantai satu per satu, metode yang diterapkan adalah...', options: { A: 'Abstraksi', B: 'Dekomposisi', C: 'Pengenalan pola', D: 'Algoritma' }, correctAnswers: { D: true }, points: 1, active: true, createdAt: Date.now() },
                        { type: 'PG', question: 'Metode pemecahan masalah dengan mengurai masalah besar dan rumit menjadi bagian-bagian yang lebih kecil dan sederhana disebut...', options: { A: 'Algoritma', B: 'Abstraksi', C: 'Dekomposisi', D: 'Iterasi' }, correctAnswers: { C: true }, points: 1, active: true, createdAt: Date.now() },
                        { type: 'PG', question: 'Ketika seseorang berbelanja di supermarket, ia langsung menuju rak barang yang diperlukan dan mengabaikan rak barang lain yang tidak dibutuhkan. Contoh tersebut menerapkan metode...', options: { A: 'Algoritma', B: 'Dekomposisi', C: 'Pengenalan pola', D: 'Abstraksi' }, correctAnswers: { D: true }, points: 1, active: true, createdAt: Date.now() },
                        { type: 'PG', question: 'Ciri utama dari metode algoritma dalam pemecahan masalah adalah...', options: { A: 'Terdiri dari langkah-langkah pemecahan yang berurutan dan terbatas', B: 'Mengabaikan rincian yang tidak penting dari suatu masalah', C: 'Mencari persamaan dan perbedaan dari objek yang diamati', D: 'Menguraikan masalah menjadi bagian yang sangat kecil' }, correctAnswers: { A: true }, points: 1, active: true, createdAt: Date.now() },
                        { type: 'PG', question: 'Dalam memilah kegiatan harian pelajar, kegiatan seperti belajar, membantu di rumah, dan beribadah dikelompokkan sebagai...', options: { A: 'Kegiatan tidak penting', B: 'Kegiatan penting', C: 'Kegiatan kurang penting', D: 'Kegiatan rekreasi bebas' }, correctAnswers: { B: true }, points: 1, active: true, createdAt: Date.now() },
                        { type: 'PG', question: 'Perhatikan deret pola bangun berikut: ▲, ■, ●, ▲, ■, ●, ... Bentuk bangun kesepuluh pada pola tersebut adalah...', options: { A: 'Persegi (■)', B: 'Lingkaran (●)', C: 'Segitiga (▲)', D: 'Belah ketupat' }, correctAnswers: { C: true }, points: 1, active: true, createdAt: Date.now() },
                        { type: 'PG', question: 'Jihan meronce hiasan berbentuk bulan dan bintang dengan pola berurutan 1 bulan dan 1 bintang secara berulang. Jika ia memiliki persediaan bentuk bulan sebanyak 17 buah dan bintang sebanyak 15 buah, maka maksimal gantungan pola utuh yang dapat dibuat Jihan adalah...', options: { A: '17', B: '16', C: '18', D: '15' }, correctAnswers: { D: true }, points: 1, active: true, createdAt: Date.now() },

                        { type: 'PG', question: 'Cara menulis algoritma dengan menggunakan bahasa manusia yang sederhana dan mirip dengan kode pemrograman disebut...', options: { A: 'Sintaks', B: 'Compiler', C: 'Variabel', D: 'Pseudocode' }, correctAnswers: { D: true }, points: 1, active: true, createdAt: Date.now() },

                        { type: 'PG', question: 'Perhatikan baris kode Python berikut: umur = 10 print(umur, "tahun") Tanda pagar (#) pada baris kode berfungsi sebagai...', options: { A: 'Perintah untuk mengalikan nilai variabel', B: 'Penanda akhir dari program komputer', C: 'Komentar yang tidak dieksekusi oleh program', D: 'Operator pembagian aritmatika' }, correctAnswers: { C: true }, points: 1, active: true, createdAt: Date.now() },

                        { type: 'PG_COMPLEX', question: 'Tentukan dua kebenaran dari pernyataan perbandingan jarak rumah dan pola berikut:', options: { A: 'Jarak 1.200 meter lebih jauh daripada jarak 1 kilometer (1.000 meter).', B: 'Rumah Ima dengan jarak 1.100 meter lebih dekat ke sekolah daripada rumah Rian (600 meter).', C: 'Deret pola angka selalu bertambah besar secara tetap tanpa pernah berulang atau membentuk siklus.', D: 'Dalam menyusun jadwal harian, evaluasi dilakukan untuk memastikan tidak ada jadwal yang tumpang tindih.' }, correctAnswers: { A: true, D: true }, points: 2, active: true, createdAt: Date.now() },
                        { type: 'PG_COMPLEX', question: 'Tentukan dua kebenaran pernyataan mengenai hubungan algoritma dan pemrograman komputer:', options: { A: 'Algoritma dan pemrograman tidak memiliki kaitan sama sekali dalam pembuatan software.', B: 'Pemrograman dijalankan tanpa mengikuti urutan langkah algoritma yang telah dibuat.', C: 'Algoritma memberikan arahan dan rencana tentang apa yang harus dilakukan oleh program.', D: 'Pemrograman adalah proses menerjemahkan algoritma ke dalam kode yang dapat dipahami komputer.' }, correctAnswers: { C: true, D: true }, points: 2, active: true, createdAt: Date.now() },
                        { type: 'PG_COMPLEX', question: 'Tentukan dua kebenaran pernyataan mengenai pseudocode dan aturan penulisan sintaks:', options: { A: 'Pseudocode dapat langsung dijalankan oleh komputer tanpa perlu diterjemahkan ke bahasa pemrograman.', B: 'Pseudocode adalah cara menulis algoritma menggunakan bahasa manusia yang mirip kode pemrograman.', C: 'Sintaks adalah aturan tata bahasa atau tata cara penulisan kode yang wajib dipatuhi dalam pemrograman.', D: 'Kata Start, If, Else, dan Print dalam pseudocode merupakan contoh aturan matematika murni.' }, correctAnswers: { B: true, C: true }, points: 2, active: true, createdAt: Date.now() },
                        { type: 'PG_COMPLEX', question: 'Tentukan dua kebenaran pernyataan terkait fungsi dan penggunaan variabel dalam pemrograman:', options: { A: 'Variabel dalam program komputer berfungsi untuk melakukan perulangan otomatis ribuan kali.', B: 'Karakter pagar (#) dalam Python digunakan untuk mendeklarasikan variabel angka bulat.', C: 'Variabel diibaratkan seperti kotak bernama yang digunakan untuk menyimpan informasi atau data.', D: 'Nilai di dalam sebuah variabel dapat diubah atau diperbarui selama program berjalan.' }, correctAnswers: { C: true, D: true }, points: 2, active: true, createdAt: Date.now() },
                        { type: 'PG_COMPLEX', question: 'Tentukan dua kebenaran pernyataan mengenai pengondisian if-else dalam bahasa Python:', options: { A: 'Pengondisian digunakan agar program dapat membuat keputusan berdasarkan situasi atau kondisi tertentu.', B: 'Sintaks if dan else merupakan pasangan utama dalam struktur pengondisian Python.', C: 'Pengondisian bersarang adalah kondisi di mana perintah diulang-ulang tanpa batas waktu.', D: 'Perintah else dieksekusi ketika syarat pada pernyataan if bernilai benar (True).' }, correctAnswers: { A: true, B: true }, points: 2, active: true, createdAt: Date.now() },
                        { type: 'PG_COMPLEX', question: 'Tentukan dua kebenaran pernyataan mengenai fungsi pengulangan dalam pemrograman:', options: { A: 'Pengulangan for umumnya digunakan ketika jumlah perulangan sudah diketahui dengan pasti.', B: 'Fungsi range(10) dalam Python menghasilkan angka bulat mulai dari 1 hingga 10.', C: 'Pengulangan while digunakan untuk menjalankan perintah selama suatu kondisi bernilai benar.', D: 'Pengulangan dalam pemrograman hanya boleh menggunakan angka negatif saja.' }, correctAnswers: { A: true, C: true }, points: 2, active: true, createdAt: Date.now() },
                        { type: 'PG_COMPLEX', question: 'Tentukan dua kebenaran pernyataan terkait logika program bersarang dan percabangan:', options: { A: 'Pengondisian bersarang adalah struktur kondisional yang berada di dalam struktur kondisional lainnya.', B: 'Jika syarat pertama pada pengondisian bersarang bernilai salah, pemeriksaan kondisi di dalam tetap dilakukan.', C: 'Program komputer tidak dapat menggabungkan konsep pengondisian dan pengulangan sekaligus.', D: 'Struktur percabangan membantu komputer menentukan jalur eksekusi kode yang berbeda berdasarkan input pengguna.' }, correctAnswers: { A: true, D: true }, points: 2, active: true, createdAt: Date.now() },
                        { type: 'PG_COMPLEX', question: 'Tentukan dua kebenaran pernyataan mengenai elemen dasar pemrograman Python:', options: { A: 'Variabel dalam pemrograman bersifat permanen dan nilai di dalamnya tidak pernah bisa diperbarui.', B: 'Tiga dasar pemrograman yang dianjurkan untuk dikuasai terlebih dahulu adalah variabel, pengondisian, dan pengulangan.', C: 'Perintah print() digunakan untuk menampilkan teks atau nilai variabel ke layar monitor.', D: 'Sintaks while dalam Python berfungsi semata-mata untuk mendeklarasikan fungsi matematika.' }, correctAnswers: { B: true, C: true }, points: 2, active: true, createdAt: Date.now() }
                    ];

                    for(let q of defaultQuestions) {
                        if (!q.chapter) q.chapter = 'Bab 1';
                        const newRef = push(qRef);
                        await set(newRef, q);
                    }
                }

                // Seed Default Classes if empty
                const classRef = ref(database, 'classes');
                const classSnap = await get(classRef);
                if(!classSnap.exists()) {
                    const defaultClasses = [
                        { name: '6 Cordova', active: true, createdAt: Date.now(), updatedAt: Date.now() },
                        { name: '6 Jerusalem', active: true, createdAt: Date.now(), updatedAt: Date.now() },
                        { name: '6 Madinah', active: true, createdAt: Date.now(), updatedAt: Date.now() },
                        { name: '6 Makkah', active: true, createdAt: Date.now(), updatedAt: Date.now() }
                    ];
                    for(let c of defaultClasses) {
                        const newRef = push(classRef);
                        await set(newRef, c);
                    }
                }

                // Seed Default Settings
                const settingsRef = ref(database, 'settings');
                const setSnap = await get(settingsRef);
                if(!setSnap.exists()) {
                    await set(settingsRef, {
                        examDuration: 60,
                        examTitle: 'Ulangan Harian',
                        examActive: true,
                        showStudentResult: true,
                        examToken: 'GAMA' + Math.floor(1000 + Math.random() * 9000),
                        examClassId: '',
                        examClassName: ''
                    });
                }
            } catch(err) {
                console.error("Seeding error:", err);
            } finally {
                window.showLoading(false);
            }
        }

        seedInitialQuestionsIfNeeded();
    </script>

    <script>
        const router = {
            currentRoute: 'home',
            params: {},
            navigate(route, params = {}) {
                if (this.currentRoute === 'exam' && route !== 'exam') stopExamIntegrityMonitoring();
                this.currentRoute = route;
                this.params = params;
                // Simpan halaman admin terakhir agar saat browser di-refresh,
                // admin tetap berada di halaman yang sedang dibuka.
                if (route.startsWith('admin-') && route !== 'admin-login') {
                    localStorage.setItem('gamaSchoolAdminRoute', JSON.stringify({ route, params }));
                }
                this.render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },
            render() {
                const container = document.getElementById('app-container');
                container.innerHTML = '';
                
                // Update header title based on route
                const headerTitle = document.getElementById('header-title');
                if(this.currentRoute.startsWith('admin')) {
                    headerTitle.innerText = "Panel Admin Evaluasi";
                } else if(this.currentRoute.startsWith('student') || this.currentRoute === 'exam' || this.currentRoute === 'result') {
                    headerTitle.innerText = "Portal Siswa - Ujian Online";
                } else {
                    headerTitle.innerText = "Gama School - Evaluasi Harian";
                }

                switch(this.currentRoute) {
                    case 'home':
                        container.innerHTML = renderHomeView();
                        break;
                    case 'student-login':
                        container.innerHTML = renderStudentLoginView();
                        initStudentLogin();
                        break;
                    case 'parent-login':
                        container.innerHTML = renderParentLoginView();
                        initParentLogin();
                        break;
                    case 'student-learning-login':
                        container.innerHTML = renderStudentLearningLoginView();
                        initStudentLearningLogin();
                        break;
                    case 'student-confirm':
                        container.innerHTML = renderStudentConfirmView(this.params);
                        initStudentConfirm(this.params);
                        break;
                    case 'exam':
                        container.innerHTML = renderExamView(this.params);
                        initExamSession(this.params);
                        break;
                    case 'result':
                        container.innerHTML = renderResultView(this.params);
                        initResultView(this.params);
                        break;
                    case 'admin-login':
                        container.innerHTML = renderAdminLoginView();
                        initAdminLogin();
                        break;
                    case 'admin-dashboard':
                        container.innerHTML = renderAdminDashboardView();
                        initAdminDashboard();
                        break;

        async function initStudentLogin() {
            const form = document.getElementById('student-login-form');
            const upcomingBox = document.getElementById('student-upcoming-exams');
            if (upcomingBox) {
                try {
                    const snap = await window.FB.get(window.FB.ref(window.db, 'examSchedules'));
                    const all = snap.exists() ? snap.val() : {};
                    const now = Date.now();
                    const upcoming = Object.values(all).filter(x => x.active !== false && new Date(x.endAt).getTime() >= now).sort((a,b) => new Date(a.startAt)-new Date(b.startAt)).slice(0,5);
                    if (upcoming.length) {
                        upcomingBox.classList.remove('hidden');
                        upcomingBox.innerHTML = '<div class="font-bold mb-2">📅 Jadwal Ulangan</div>' + upcoming.map(x => {
                            const start = new Date(x.startAt), diff = start.getTime()-now;
                            const countdown = diff <= 0 ? 'Sedang berlangsung' : diff < 86400000 ? `Mulai ${Math.ceil(diff/3600000)} jam lagi` : `Mulai ${Math.ceil(diff/86400000)} hari lagi`;
                            return `<div class="py-2 border-t border-indigo-100"><div class="font-semibold">${escapeHtml(x.title || 'Ulangan')} · ${escapeHtml(x.className || '-')}</div><div>${escapeHtml(x.startAt || '').replace('T',' ')} · ${escapeHtml(countdown)}</div></div>`;
                        }).join('');
                    }
                } catch (e) { console.warn('Jadwal mendatang belum dapat dimuat', e); }
            }
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const nis = document.getElementById('student-nis').value.trim();
                const token = document.getElementById('student-token').value.trim().toUpperCase();

                window.showLoading(true, "Memeriksa NIS dan token...");
                try {
                    const [studentSnap, settingsSnap, classSnap] = await Promise.all([
                        window.FB.get(window.FB.ref(window.db, 'students')),
                        window.FB.get(window.FB.ref(window.db, 'settings')),
                        window.FB.get(window.FB.ref(window.db, 'classes'))
                    ]);

                    if (!studentSnap.exists()) throw new Error("Data siswa belum tersedia.");
                    let settings = settingsSnap.exists() ? settingsSnap.val() : {};
                    const schedulesSnap = await window.FB.get(window.FB.ref(window.db, 'examSchedules'));
                    const schedules = schedulesSnap.exists() ? schedulesSnap.val() : {};
                    const matchedSchedule = Object.values(schedules).find(x => x.active !== false && String(x.token || '').toUpperCase() === token);
                    if (matchedSchedule) {
                        const now = Date.now(), start = new Date(matchedSchedule.startAt).getTime(), end = new Date(matchedSchedule.endAt).getTime();
                        if (now < start) {
                            const ms = start - now, days = Math.floor(ms / 86400000), hours = Math.floor((ms % 86400000) / 3600000), mins = Math.floor((ms % 3600000) / 60000);
                            throw new Error(`Ulangan ${matchedSchedule.title || ''} untuk ${matchedSchedule.className} belum dimulai. Mulai ${new Date(start).toLocaleString('id-ID')}. Tersisa ${days ? days+' hari ' : ''}${hours} jam ${mins} menit.`);
                        }
                        if (now > end) throw new Error('Waktu sesi ulangan ini sudah berakhir.');
                        settings = { ...settings, examTitle: matchedSchedule.title, examClassId: matchedSchedule.classId, examClassName: matchedSchedule.className, examChapter: matchedSchedule.chapter, examDuration: matchedSchedule.duration, examToken: matchedSchedule.token, examActive: true };
                    } else {
                        if (settings.examActive === false) throw new Error("Ulangan sedang tidak dibuka.");
                        if (!settings.examToken || settings.examToken.toUpperCase() !== token) throw new Error("Token ulangan salah atau sudah tidak berlaku.");
                    }

                    const students = studentSnap.val();
                    const classes = classSnap.exists() ? classSnap.val() : {};
                    let studentId = null, student = null;
                    Object.keys(students).forEach(id => {
                        if (String(students[id].nis || '').trim() === nis && students[id].active !== false) {
                            studentId = id;
                            const rawStudent = students[id];
                            const classId = rawStudent.classId || '';
                            const liveClassName = classId && classes[classId]
                                ? (classes[classId].name || '-')
                                : (rawStudent.className || '-');
                            student = { id, ...rawStudent, classId, className: liveClassName };
                        }
                    });
                    if (!student) throw new Error("NIS tidak ditemukan.");

                    // Pastikan siswa berasal dari kelas yang dipilih guru untuk ulangan ini.
                    const examClassId = String(settings.examClassId || '').trim();
                    const examClassName = String(settings.examClassName || '').trim();
                    if (examClassId) {
                        if (String(student.classId || '').trim() !== examClassId) {
                            throw new Error(`Ulangan ini khusus untuk kelas ${examClassName || 'yang dipilih guru'}.`);
                        }
                    } else if (examClassName) {
                        if (String(student.className || '').trim().toLowerCase() !== examClassName.toLowerCase()) {
                            throw new Error(`Ulangan ini khusus untuk kelas ${examClassName}.`);
                        }
                    }

                    window.showLoading(false);
                    router.navigate('student-confirm', {
                        studentId,
                        studentName: student.name,
                        nis: student.nis,
                        classId: student.classId,
                        className: student.className || '-',
                        token,
                        examTitle: settings.examTitle || 'Ulangan Harian',
                        examChapter: settings.examChapter || 'Belum dipilih',
                        examClassId: settings.examClassId || '',
                        examClassName: settings.examClassName || ''
                    });
                } catch (err) {
                    window.showLoading(false);
                    window.showToast(err.message || 'Gagal masuk.', 'error');
                }
            });
        }

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getQuestionMaxPoints(q) {
            if (q.type === 'PG') return 1;
            if (q.type === 'PG_COMPLEX') return 2;
            return Math.max(0, Number(q.points) || 1);
        }

        function normalizeQuestionType(type) {
            if (type === 'ISIAN' || type === 'FILL') return 'ISIAN';
            if (type === 'ESSAY') return 'ESSAY';
            if (type === 'PG_COMPLEX') return 'PG_COMPLEX';
            return 'PG';
        }

        function getQuestionChapter(q) {
            const chapter = String(q?.chapter || '').trim();
            return chapter || 'Belum ditentukan';
        }

        function getChapterList(data) {
            const chapters = new Set();
            Object.values(data || {}).forEach(q => chapters.add(getQuestionChapter(q)));
            return Array.from(chapters).sort((a, b) => a.localeCompare(b, 'id', { numeric: true, sensitivity: 'base' }));
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>\"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[ch]));
        }

        async function createOrResumeExamSession(params) {
            const settingsSnap = await window.FB.get(window.FB.ref(window.db, 'settings'));
            const settings = settingsSnap.exists() ? settingsSnap.val() : { examDuration: 60 };

            const sessionSnap = await window.FB.get(window.FB.ref(window.db, 'examSessions'));
            let existingSessionId = null;
            if (sessionSnap.exists()) {
                Object.keys(sessionSnap.val()).forEach(sid => {
                    const x = sessionSnap.val()[sid];
                    if (x.studentId === params.studentId && x.status === 'active') existingSessionId = sid;
                });
            }
            if (existingSessionId) return existingSessionId;

            const qSnap = await window.FB.get(window.FB.ref(window.db, 'questions'));
            if (!qSnap.exists()) throw new Error("Bank soal belum tersedia.");

            const all = qSnap.val();
            const selectedChapter = String(settings.examChapter || '').trim();
            if (!selectedChapter) {
                throw new Error('Guru belum memilih bab yang akan diujikan. Silakan pilih bab di Pengaturan.');
            }

            const activeQuestions = Object.keys(all)
                .filter(id => all[id].active !== false)
                .map(id => ({ id, ...all[id], type: normalizeQuestionType(all[id].type) }))
                .filter(q => getQuestionChapter(q) === selectedChapter);

            if (!activeQuestions.length) {
                throw new Error(`Belum ada soal aktif untuk ${selectedChapter}.`);
            }

            // Ambil jumlah soal sesuai komposisi yang diatur admin di Bank Soal.
            let combinedQuestions;
            const compSnap = await window.FB.get(window.FB.ref(window.db, 'settings/questionComposition'));
            const savedComp = compSnap.exists() ? (compSnap.val()[compositionKey(selectedChapter)] || null) : null;
            if (savedComp) {
                const groups = { PG: [], PG_COMPLEX: [], ISIAN: [], ESSAY: [] };
                activeQuestions.forEach(q => { if (groups[q.type]) groups[q.type].push(q); });
                const requested = { PG: Number(savedComp.PG)||0, PG_COMPLEX: Number(savedComp.PG_COMPLEX)||0, ISIAN: Number(savedComp.ISIAN)||0, ESSAY: Number(savedComp.ESSAY)||0 };
                const shortage = Object.keys(requested).find(k => requested[k] > groups[k].length);
                if (shortage) throw new Error(`Komposisi ${shortage === 'PG_COMPLEX' ? 'PG Kompleks' : shortage} untuk ${selectedChapter} membutuhkan ${requested[shortage]} soal, tetapi tersedia ${groups[shortage].length}.`);
                combinedQuestions = Object.keys(requested).flatMap(k => shuffleArray(groups[k]).slice(0, requested[k]));
                combinedQuestions = shuffleArray(combinedQuestions);
            } else {
                combinedQuestions = shuffleArray(activeQuestions);
            }
            const questionIdsMap = {};

            combinedQuestions.forEach(q => {
                const originalOptions = q.options || {};
                const keys = Object.keys(originalOptions);
                const shuffledKeys = shuffleArray(keys);
                const newOptions = {};
                const newCorrectAnswers = {};
                shuffledKeys.forEach((oldKey, idx) => {
                    const newKey = String.fromCharCode(65 + idx);
                    newOptions[newKey] = originalOptions[oldKey];
                    if (q.correctAnswers && q.correctAnswers[oldKey]) newCorrectAnswers[newKey] = true;
                });
                questionIdsMap[q.id] = {
                    shuffledOptions: newOptions,
                    shuffledCorrectAnswers: newCorrectAnswers,
                    originalQuestionId: q.id,
                    type: q.type,
                    maxPoints: getQuestionMaxPoints(q)
                };
            });

            const newSessRef = window.FB.push(window.FB.ref(window.db, 'examSessions'));
            const sessionId = newSessRef.key;
            const startTime = Date.now();
            const durationMinutes = parseInt(settings.examDuration) || 60;

            await window.FB.set(newSessRef, {
                sessionId,
                studentId: params.studentId,
                studentName: params.studentName,
                nis: params.nis,
                classId: params.classId || '',
                className: params.className || '-',
                examClassId: settings.examClassId || '',
                examClassName: settings.examClassName || '',
                examTitle: settings.examTitle || 'Ulangan Harian',
                examChapter: selectedChapter,
                questionMap: questionIdsMap,
                questionIds: combinedQuestions.map(q => q.id),
                startTime,
                endTime: startTime + durationMinutes * 60 * 1000,
                duration: durationMinutes,
                status: 'active',
                answers: {}
            });
            return sessionId;
        }

        let currentExamState = {
            sessionId: null,
            studentId: null,
            questionIds: [],
            questionMap: {},
            answers: {},
            currentIndex: 0,
            allQuestionsData: {},
            timerInterval: null
        };


        // Pengawasan ujian: catat indikasi, bukan bukti pasti kecurangan.
        let examIntegrityHandlers = null;
        let examIntegrityCount = 0;
        let examIntegrityLastEventAt = 0;
        let examIntegritySessionId = null;

        async function setupExamIntegrityMonitoring(sessData) {
            stopExamIntegrityMonitoring();
            if (router.currentRoute !== 'exam' || !currentExamState.sessionId) return;
            examIntegritySessionId = currentExamState.sessionId;
            examIntegrityCount = 0;
            examIntegrityLastEventAt = 0;
            try {
                const oldSnap = await window.FB.get(window.FB.ref(window.db, `examSessions/${examIntegritySessionId}/integrityEvents`));
                if (oldSnap.exists()) examIntegrityCount = Object.keys(oldSnap.val() || {}).length;
            } catch (e) { console.warn('Tidak dapat membaca catatan pengawasan lama:', e); }
            if (router.currentRoute !== 'exam' || examIntegritySessionId !== currentExamState.sessionId) return;

            const logIntegrityEvent = async (type, detail) => {
                if (router.currentRoute !== 'exam' || !examIntegritySessionId || examIntegritySessionId !== currentExamState.sessionId) return;
                const now = Date.now();
                // Hindari duplikasi event yang terpicu berdekatan.
                if (now - examIntegrityLastEventAt < 700) return;
                examIntegrityLastEventAt = now;
                examIntegrityCount += 1;
                const event = {
                    type,
                    detail: detail || '',
                    timestamp: now,
                    studentId: currentExamState.studentId || '',
                    studentName: sessData.studentName || '',
                    nis: sessData.nis || '',
                    className: sessData.className || '',
                    examTitle: sessData.examTitle || '',
                    count: examIntegrityCount
                };
                try {
                    const eventRef = window.FB.push(window.FB.ref(window.db, `examSessions/${examIntegritySessionId}/integrityEvents`));
                    await window.FB.set(eventRef, event);
                } catch (err) {
                    console.warn('Catatan pengawasan tidak berhasil disimpan:', err);
                }
                let message;
                if (examIntegrityCount === 1) message = `Peringatan 1: aktivitas di luar halaman ujian terdeteksi dan dicatat.`;
                else if (examIntegrityCount === 2) message = `Peringatan 2: aktivitas serupa kembali terdeteksi. Catatan tersimpan.`;
                else message = `Perhatian: aktivitas ke-${examIntegrityCount} tercatat. Guru dapat meninjau aktivitas ini.`;
                window.showToast(message, 'warning');
            };

            const onVisibilityChange = () => {
                if (document.visibilityState === 'hidden') logIntegrityEvent('tab_hidden', 'Berpindah tab atau meminimalkan browser');
            };
            const onClipboardAttempt = (event) => {
                event.preventDefault();
                const labels = { copy: 'menyalin teks', cut: 'memotong teks', paste: 'menempelkan teks' };
                logIntegrityEvent('clipboard_' + event.type, labels[event.type] || event.type);
            };
            const onContextMenu = (event) => {
                event.preventDefault();
                logIntegrityEvent('context_menu', 'Mencoba membuka menu klik kanan');
            };
            document.addEventListener('visibilitychange', onVisibilityChange);
            document.addEventListener('copy', onClipboardAttempt, true);
            document.addEventListener('cut', onClipboardAttempt, true);
            document.addEventListener('paste', onClipboardAttempt, true);
            document.addEventListener('contextmenu', onContextMenu, true);
            examIntegrityHandlers = { onVisibilityChange, onClipboardAttempt, onContextMenu };
        }

        function stopExamIntegrityMonitoring() {
            if (examIntegrityHandlers) {
                document.removeEventListener('visibilitychange', examIntegrityHandlers.onVisibilityChange);
                document.removeEventListener('copy', examIntegrityHandlers.onClipboardAttempt, true);
                document.removeEventListener('cut', examIntegrityHandlers.onClipboardAttempt, true);
                document.removeEventListener('paste', examIntegrityHandlers.onClipboardAttempt, true);
                document.removeEventListener('contextmenu', examIntegrityHandlers.onContextMenu, true);
            }
            examIntegrityHandlers = null;
            examIntegritySessionId = null;
        }

        async function initExamSession(params) {
            currentExamState.sessionId = params.sessionId;
            currentExamState.studentId = params.studentId;

            window.showLoading(true, "Memuat soal ujian...");
            try {
                // Fetch session
                const sessSnap = await window.FB.get(window.FB.ref(window.db, `examSessions/${params.sessionId}`));
                if (!sessSnap.exists()) {
                    window.showLoading(false);
                    window.showToast('Sesi ujian tidak ditemukan!', 'error');
                    router.navigate('home');
                    return;
                }

                const sessData = sessSnap.val();
                if (sessData.status === 'completed') {
                    window.showLoading(false);
                    router.navigate('result', { sessionId: params.sessionId });
                    return;
                }

                setupExamIntegrityMonitoring(sessData);
                document.getElementById('exam-student-name').innerText = sessData.examTitle || 'Ulangan Online';
                document.getElementById('exam-student-class').innerText = `${sessData.studentName} • Kelas: ${sessData.className} • NIS: ${sessData.nis}`;
                const chapterEl = document.getElementById('exam-chapter-name');
                if (chapterEl) chapterEl.innerText = `Bab: ${sessData.examChapter || 'Belum ditentukan'}`;

                currentExamState.questionIds = sessData.questionIds;
                currentExamState.questionMap = sessData.questionMap;
                currentExamState.answers = sessData.answers || {};

                // Fetch actual questions content
                const qSnap = await window.FB.get(window.FB.ref(window.db, 'questions'));
                currentExamState.allQuestionsData = qSnap.val() || {};

                window.showLoading(false);

                // Start Timer
                startExamTimer(sessData.endTime);

                // Render first question
                renderQuestion(0);
                renderPalette();

            } catch (err) {
                window.showLoading(false);
                console.error(err);
                window.showToast('Gagal memuat ujian!', 'error');
            }
        }

        function startExamTimer(endTime) {
            if (currentExamState.timerInterval) clearInterval(currentExamState.timerInterval);

            currentExamState.timerInterval = setInterval(() => {
                const now = Date.now();
                const diff = endTime - now;

                if (diff <= 0) {
                    clearInterval(currentExamState.timerInterval);
                    document.getElementById('timer-display').innerText = "00:00:00";
                    window.showToast('Waktu ujian telah habis!', 'error');
                    autoSubmitExamDueToTime();
                    return;
                }

                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('timer-display').innerText = 
                    `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }, 1000);
        }

        function renderQuestion(index) {
            currentExamState.currentIndex = index;
            const qId = currentExamState.questionIds[index];
            const qMeta = currentExamState.questionMap[qId];
            const qRaw = currentExamState.allQuestionsData[qId];
            if (!qRaw || !qMeta) return;

            document.getElementById('q-number-indicator').innerText =
                `Soal ${index + 1} dari ${currentExamState.questionIds.length}`;

            const typeBadge = document.getElementById('q-type-badge');
            const labels = {
                PG: 'Pilihan Ganda (1 Poin)',
                PG_COMPLEX: 'Pilihan Ganda Kompleks (2 Poin)',
                ISIAN: 'Isian',
                ESSAY: 'Essay'
            };
            typeBadge.innerText = labels[qMeta.type] || qMeta.type;

            document.getElementById('question-text').innerText = `${index + 1}. ${qRaw.question}`;
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const currentAnswer = currentExamState.answers[qId];

            if (qMeta.type === 'PG' || qMeta.type === 'PG_COMPLEX') {
                const opts = qMeta.shuffledOptions || {};
                Object.keys(opts).sort().forEach(key => {
                    const isChecked = qMeta.type === 'PG'
                        ? currentAnswer === key
                        : Array.isArray(currentAnswer) && currentAnswer.includes(key);

                    optionsContainer.innerHTML += `
                        <label class="flex items-start p-4 rounded-xl border-2 transition cursor-pointer ${isChecked ? 'border-brand-600 bg-brand-50/50' : 'border-slate-200 hover:bg-slate-50'}">
                            <input type="${qMeta.type === 'PG' ? 'radio' : 'checkbox'}"
                                name="answer-${qId}" value="${key}" ${isChecked ? 'checked' : ''}
                                onchange="handleAnswerChange('${qId}', '${key}', '${qMeta.type}')"
                                class="mt-1 h-4 w-4 text-brand-600 focus:ring-brand-500">
                            <span class="ml-3 font-semibold text-slate-700 w-6">${key}.</span>
                            <span class="ml-1 text-slate-800">${opts[key]}</span>
                        </label>`;
                });
            } else if (qMeta.type === 'ISIAN') {
                optionsContainer.innerHTML = `
                    <input id="manual-answer-${qId}" type="text"
                        value="${currentAnswer ? String(currentAnswer).replace(/"/g, '&quot;') : ''}"
                        oninput="handleTextAnswerChange('${qId}', this.value)"
                        placeholder="Tuliskan jawaban..."
                        class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 outline-none">`;
            } else {
                optionsContainer.innerHTML = `
                    <textarea id="manual-answer-${qId}" rows="7"
                        oninput="handleTextAnswerChange('${qId}', this.value)"
                        placeholder="Tuliskan jawaban essay..."
                        class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 outline-none">${currentAnswer || ''}</textarea>`;
            }

            document.getElementById('btn-prev').disabled = index === 0;
            document.getElementById('btn-prev').className = index === 0
                ? 'px-5 py-2.5 bg-slate-100 text-slate-400 font-semibold rounded-xl border border-slate-200 cursor-not-allowed flex items-center space-x-2'
                : 'px-5 py-2.5 bg-white hover:bg-slate-100 text-slate-700 font-semibold rounded-xl border border-slate-300 transition flex items-center space-x-2';

            const nextBtn = document.getElementById('btn-next');
            if (index === currentExamState.questionIds.length - 1) {
                nextBtn.innerHTML = `<span>Selesai</span> <i class="fa-solid fa-check"></i>`;
                nextBtn.onclick = () => confirmSubmitExam();
            } else {
                nextBtn.innerHTML = `<span>Selanjutnya</span> <i class="fa-solid fa-arrow-right"></i>`;
                nextBtn.onclick = () => navigateQuestion(1);
            }
            renderPalette();
        }

        window.navigateQuestion = function(direction) {
            const newIndex = currentExamState.currentIndex + direction;
            if (newIndex >= 0 && newIndex < currentExamState.questionIds.length) renderQuestion(newIndex);
        };

        window.handleAnswerChange = async function(qId, optionKey, type) {
            if (type === 'PG') {
                currentExamState.answers[qId] = optionKey;
            } else {
                if (!Array.isArray(currentExamState.answers[qId])) currentExamState.answers[qId] = [];
                const arr = currentExamState.answers[qId];
                const idx = arr.indexOf(optionKey);
                if (idx > -1) arr.splice(idx, 1);
                else {
                    if (arr.length >= 2) {
                        window.showToast('PG Kompleks harus tepat maksimal 2 pilihan.', 'error');
                        renderQuestion(currentExamState.currentIndex);
                        return;
                    }
                    arr.push(optionKey);
                }
                currentExamState.answers[qId] = arr;
            }
            renderPalette();
            await saveAnswer(qId, currentExamState.answers[qId]);
        };

        window.handleTextAnswerChange = async function(qId, value) {
            currentExamState.answers[qId] = value;
            renderPalette();
            clearTimeout(window.__answerSaveTimer);
            window.__answerSaveTimer = setTimeout(() => saveAnswer(qId, value), 300);
        };

        async function saveAnswer(qId, value) {
            try {
                await window.FB.update(window.FB.ref(window.db, `examSessions/${currentExamState.sessionId}/answers`), {
                    [qId]: value
                });
            } catch (err) {
                console.error("Autosave error:", err);
                window.showToast('Jawaban belum tersinkron. Coba lagi saat koneksi stabil.', 'warning');
            }
        }

        function renderPalette() {
            const paletteContainer = document.getElementById('question-grid-palette');
            paletteContainer.innerHTML = '';
            let answeredCount = 0;

            currentExamState.questionIds.forEach((qId, idx) => {
                const ans = currentExamState.answers[qId];
                let isAnswered = false;
                if (Array.isArray(ans)) {
                    if (ans.length > 0) isAnswered = true;
                } else if (ans) {
                    isAnswered = true;
                }

                if (isAnswered) answeredCount++;

                const isActive = idx === currentExamState.currentIndex;
                let btnClass = "h-10 rounded-xl font-semibold text-sm flex items-center justify-center transition border ";

                if (isActive) {
                    btnClass += "border-brand-600 bg-brand-50 text-brand-700 ring-2 ring-brand-500/20";
                } else if (isAnswered) {
                    btnClass += "bg-emerald-500 text-white border-emerald-600 shadow-sm";
                } else {
                    btnClass += "bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200";
                }

                paletteContainer.innerHTML += `
                    <button onclick="renderQuestion(${idx})" class="${btnClass}">${idx + 1}</button>
                `;
            });

            document.getElementById('answered-count').innerText = `${answeredCount}/${currentExamState.questionIds.length} Terjawab`;
        }

        window.confirmSubmitExam = function() {
            // Show custom modal confirmation
            const modalContainer = document.getElementById('modal-container');
            const modalContent = document.getElementById('modal-content');

            modalContent.innerHTML = `
                <div class="p-6 text-center">
                    <div class="w-16 h-16 bg-amber-50 text-amber-600 rounded-full mx-auto flex items-center justify-center text-2xl mb-4 shadow-inner">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                    </div>
                    <h3 class="text-xl font-bold text-slate-900 mb-2">Kumpulkan Ujian?</h3>
                    <p class="text-sm text-slate-500 mb-6">Apakah Anda yakin ingin mengumpulkan ujian? Jawaban yang sudah dikumpulkan tidak dapat diubah kembali.</p>
                    <div class="flex space-x-3">
                        <button onclick="closeModal()" class="flex-1 py-3 bg-white hover:bg-slate-100 text-slate-700 font-semibold rounded-xl border border-slate-300 transition">Batal</button>
                        <button onclick="executeSubmitExam()" class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-lg transition">Ya, Kumpulkan</button>
                    </div>

        window.closeModal = function() {
            document.getElementById('modal-container').classList.add('hidden');
        };

        async function autoSubmitExamDueToTime() {
            await executeSubmitExam(true);
        }

        window.executeSubmitExam = async function(isTimeout = false) {
            closeModal();
            if (currentExamState.timerInterval) clearInterval(currentExamState.timerInterval);
            window.showLoading(true, "Menghitung nilai...");
            try {
                const sessSnap = await window.FB.get(window.FB.ref(window.db, `examSessions/${currentExamState.sessionId}`));
                if (!sessSnap.exists()) throw new Error("Sesi ulangan tidak ditemukan.");
                const sessData = sessSnap.val();
                const answers = sessData.answers || {};
                const questionMap = sessData.questionMap || {};

                let autoPoints = 0, manualEarned = 0, maxPoints = 0;
                let pgCorrect = 0, pgComplexCorrect = 0, manualCount = 0;

                Object.keys(questionMap).forEach(qId => {
                    const meta = questionMap[qId];
                    const ans = answers[qId];
                    const max = Number(meta.maxPoints || (meta.type === 'PG' ? 1 : meta.type === 'PG_COMPLEX' ? 2 : 1));
                    maxPoints += max;

                    if (meta.type === 'PG') {
                        if (ans && meta.shuffledCorrectAnswers && meta.shuffledCorrectAnswers[ans]) {
                            autoPoints += 1;
                            pgCorrect++;
                        }
                    } else if (meta.type === 'PG_COMPLEX') {
                        const selected = Array.isArray(ans) ? [...ans].sort() : [];
                        const correct = Object.keys(meta.shuffledCorrectAnswers || {}).sort();
                        if (selected.length === correct.length && selected.every((v,i) => v === correct[i])) {
                            autoPoints += 2;
                            pgComplexCorrect++;
                        }
                    } else {
                        manualCount++;
                    }
                });

                const totalEarned = autoPoints;
                const finalScore = maxPoints > 0
                    ? Number(((totalEarned / maxPoints) * 100).toFixed(2))
                    : 0;

                const submitTime = Date.now();
                const resultRef = window.FB.push(window.FB.ref(window.db, 'examResults'));
                const resultId = resultRef.key;

                const resultPayload = {
                    resultId, sessionId: currentExamState.sessionId,
                    studentId: sessData.studentId, studentName: sessData.studentName,
                    nis: sessData.nis, classId: sessData.classId, className: sessData.className,
                    examTitle: sessData.examTitle || 'Ulangan Harian', examChapter: sessData.examChapter || 'Belum ditentukan',
                    autoPoints, manualEarned, totalPoints: totalEarned,
                    maxPoints, finalScore,
                    pgCorrect, pgComplexCorrect, manualCount,
                    manualGraded: manualCount === 0,
                    startTime: sessData.startTime, submitTime, status: 'completed',
                    answers
                };

                await window.FB.set(resultRef, resultPayload);
                await window.FB.update(window.FB.ref(window.db, `examSessions/${currentExamState.sessionId}`), {
                    status: 'completed', submitTime, autoPoints, totalPoints: totalEarned, maxPoints, finalScore
                });
                await window.FB.update(window.FB.ref(window.db, `students/${sessData.studentId}`), {
                    examStatus: 'completed'
                });

                const historyRef = window.FB.push(window.FB.ref(window.db, `examHistory/${sessData.studentId}`));
                await window.FB.set(historyRef, {
                    resultId, totalPoints: totalEarned, maxPoints, finalScore, submitTime, detail: answers
                });
                localStorage.removeItem('gamaSchoolActiveSession');

                window.showLoading(false);
                window.showToast(isTimeout ? 'Waktu habis! Ulangan berhasil dikumpulkan.' : 'Ulangan berhasil dikumpulkan!', 'success');
                router.navigate('result', { sessionId: currentExamState.sessionId, resultId });
            } catch (err) {
                window.showLoading(false);
                console.error(err);
                window.showToast('Gagal mengumpulkan ulangan: ' + err.message, 'error');
            }
        };

        async function initResultView(params) {
            window.showLoading(true, "Memuat hasil ulangan...");
            try {
                let resData = null;
                const path = params.resultId ? `examResults/${params.resultId}` : null;
                if (path) {
                    const snap = await window.FB.get(window.FB.ref(window.db, path));
                    if (snap.exists()) resData = snap.val();
                } else if (params.sessionId) {
                    const snap = await window.FB.get(window.FB.ref(window.db, 'examResults'));
                    if (snap.exists()) Object.values(snap.val()).forEach(x => {
                        if (x.sessionId === params.sessionId) resData = x;
                    });
                }
                if (!resData) throw new Error("Data hasil tidak ditemukan.");

                document.getElementById('res-name').innerText = resData.studentName || '-';
                document.getElementById('res-class').innerText = `${resData.className || '-'} (NIS: ${resData.nis || '-'})`;
                const resChapter = document.getElementById('res-chapter');
                if (resChapter) resChapter.innerText = resData.examChapter || 'Belum ditentukan';
                document.getElementById('res-pg').innerText = `${resData.pgCorrect || 0} poin`;
                document.getElementById('res-complex').innerText = `${resData.pgComplexCorrect || 0} soal`;
                document.getElementById('res-total').innerText = `${resData.autoPoints || 0} / ${resData.maxPoints || 0}`;
                document.getElementById('res-manual').innerText = resData.manualCount
                    ? `${resData.manualCount} soal menunggu guru`
                    : 'Tidak ada';
                document.getElementById('res-score').innerText = Number(resData.finalScore || 0).toFixed(2);

                if (resData.manualCount > 0 && !resData.manualGraded) {
                    document.getElementById('manual-notice').classList.remove('hidden');
                }
                window.showLoading(false);
            } catch (err) {
                window.showLoading(false);
                window.showToast(err.message, 'error');
            }
        }

        async function initParentLogin() {
            const form = document.getElementById('parent-login-form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const nis = String(document.getElementById('parent-nis').value || '').trim();
                const pin = String(document.getElementById('parent-pin').value || '').trim();
                const out = document.getElementById('parent-results');
                if (!nis || !pin) return;
                window.showLoading(true, 'Mencari data siswa dan nilai...');
                try {
                    const [studentsSnap, resultsSnap, classesSnap] = await Promise.all([
                        window.FB.get(window.FB.ref(window.db, 'students')),
                        window.FB.get(window.FB.ref(window.db, 'examResults')),
                        window.FB.get(window.FB.ref(window.db, 'classes'))
                    ]);
                    const students = studentsSnap.exists() ? studentsSnap.val() : {};
                    const classes = classesSnap.exists() ? classesSnap.val() : {};
                    const studentEntry = Object.entries(students).find(([id, st]) => String(st.nis || '').trim() === nis && st.active !== false);
                    if (!studentEntry) throw new Error('NIS tidak ditemukan. Periksa kembali NIS yang dimasukkan.');
                    const [studentId, student] = studentEntry;
                    if (!student.parentPin) throw new Error('PIN orang tua belum dibuat. Silakan hubungi admin sekolah.');
                    if (String(student.parentPin) !== pin) throw new Error('NIS atau PIN salah. Periksa kembali data yang dimasukkan.');
                    const className = (student.classId && classes[student.classId] && classes[student.classId].name) || student.className || '-';
                    const results = resultsSnap.exists() ? Object.entries(resultsSnap.val()) : [];
                    const myResults = results.filter(([id, r]) => String(r.nis || '').trim() === nis || (r.studentId && r.studentId === studentId))
                        .map(([id, r]) => ({ id, ...r }))
                        .sort((a,b) => Number(b.submitTime || b.createdAt || 0) - Number(a.submitTime || a.createdAt || 0));
                    const safe = (v) => String(v ?? '-').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
                    const dateFmt = (ts) => ts ? new Date(Number(ts)).toLocaleString('id-ID', { dateStyle:'medium', timeStyle:'short' }) : '-';
                    const cards = myResults.length ? myResults.map(r => `
                        <div class="rounded-2xl border border-slate-200 p-4 sm:p-5 bg-white">
                            <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-2">
                                <div><h4 class="font-bold text-slate-900">${safe(r.examTitle || r.title || 'Ujian')}</h4><p class="text-sm text-slate-500 mt-1">BAB: ${safe(r.examChapter || r.chapter || r.bab || 'Belum ditentukan')}</p><p class="text-xs text-slate-400 mt-1">${safe(dateFmt(r.submitTime || r.createdAt))}</p></div>
                                <div class="sm:text-right"><div class="text-2xl font-extrabold text-emerald-700">${safe(Number(r.finalScore ?? 0).toFixed(2))}</div><span class="text-xs text-slate-500">Nilai akhir</span></div>
                            </div>
                            <div class="mt-3 text-sm text-slate-600">Status: <strong>${safe(r.manualCount && !r.manualGraded ? 'Menunggu pemeriksaan guru' : (r.status === 'completed' ? 'Selesai' : (r.status || 'Tercatat')))}</strong></div>
                        </div>`).join('') : '<div class="rounded-2xl border border-dashed border-slate-300 p-8 text-center text-slate-500">Belum ada hasil ujian untuk NIS ini.</div>';
                    out.innerHTML = `
                        <div class="mb-5 rounded-2xl bg-emerald-50 border border-emerald-100 p-5">
                            <p class="text-xs font-semibold uppercase tracking-wide text-emerald-700">Data Siswa</p>
                            <h3 class="text-xl font-bold text-slate-900 mt-1">${safe(student.name || student.studentName || '-')}</h3>
                            <p class="text-sm text-slate-600 mt-1">Kelas ${safe(className)} · NIS ${safe(nis)}</p>
                            <p class="text-sm text-slate-600 mt-2">Jumlah riwayat ujian: <strong>${myResults.length}</strong></p>
                        </div>
                        <h3 class="font-bold text-slate-900 mb-3">Riwayat Nilai Ujian</h3>
                        <div class="space-y-3">${cards}</div>
                        <div class="mt-5 rounded-2xl border border-slate-200 p-4">
                            <h4 class="font-bold text-slate-900 mb-2">Ganti PIN Orang Tua</h4>
                            <p class="text-xs text-slate-500 mb-3">Gunakan PIN baru minimal 4 digit. Simpan PIN baru dengan aman.</p>
                            <form id="parent-change-pin-form" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                <input id="parent-current-pin" type="password" required inputmode="numeric" placeholder="PIN saat ini" class="px-3 py-2.5 rounded-xl border border-slate-300">
                                <input id="parent-new-pin" type="password" required inputmode="numeric" minlength="4" maxlength="12" placeholder="PIN baru (4–12 digit)" class="px-3 py-2.5 rounded-xl border border-slate-300">
                                <input id="parent-confirm-pin" type="password" required inputmode="numeric" minlength="4" maxlength="12" placeholder="Ulangi PIN baru" class="px-3 py-2.5 rounded-xl border border-slate-300">
                                <button type="submit" class="sm:col-span-3 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold">Simpan PIN Baru</button>
                            </form>
                            <p class="text-xs text-amber-700 mt-3">Jika lupa PIN, hubungi admin untuk mengatur PIN baru. Admin dapat melihat PIN yang tersimpan di data siswa; karena itu akses admin dan Rules Firebase harus benar-benar dibatasi.</p>
                        </div>
                        <div class="mt-5">
                            <button type="button" onclick="parentPortalLogout()" class="w-full py-3 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-semibold"><i class="fa-solid fa-house mr-2"></i>Kembali ke Beranda</button>
                        </div>`;
                    document.getElementById('parent-change-pin-form').addEventListener('submit', async (ev) => {
                        ev.preventDefault();
                        const currentPin = document.getElementById('parent-current-pin').value.trim();
                        const newPin = document.getElementById('parent-new-pin').value.trim();
                        const confirmPin = document.getElementById('parent-confirm-pin').value.trim();
                        if (currentPin !== String(student.parentPin)) return window.showToast('PIN saat ini tidak sesuai.', 'error');
                        if (!/^\d{4,12}$/.test(newPin)) return window.showToast('PIN baru harus 4–12 digit angka.', 'error');
                        if (newPin !== confirmPin) return window.showToast('Konfirmasi PIN baru tidak sama.', 'error');
                        if (newPin === currentPin) return window.showToast('PIN baru harus berbeda dari PIN lama.', 'error');
                        try {
                            await window.FB.update(window.FB.ref(window.db, `students/${studentId}`), { parentPin: newPin, parentPinUpdatedAt: Date.now() });
                            student.parentPin = newPin;
                            document.getElementById('parent-current-pin').value = '';
                            document.getElementById('parent-new-pin').value = '';
                            document.getElementById('parent-confirm-pin').value = '';
                            document.getElementById('parent-pin').value = newPin;
                            window.showToast('PIN orang tua berhasil diganti.', 'success');
                        } catch (pinErr) { window.showToast('Gagal mengganti PIN: ' + pinErr.message, 'error'); }
                    });
                } catch (err) {
                    out.innerHTML = `<div class="rounded-xl border border-rose-200 bg-rose-50 p-4 text-sm text-rose-700">${String(err.message || 'Data gagal dimuat.').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}</div>`;
                } finally {
                    window.showLoading(false);
                }
            });
        }

        let allStudentsCache = {};

        // --- PERBAIKAN KELAS DUPLIKAT ---
        // Satu nama kelas hanya boleh mewakili satu classId. Jika data lama
        // membuat dua classId dengan nama yang sama, siswa dan data terkait
        // dipindahkan ke classId yang paling banyak dipakai lalu class duplikat
        // dinonaktifkan. Ini membuat Patria kembali bergabung dengan teman-temannya.
        function normalizeClassName(name) {
            return String(name || '').replace(/\s+/g, ' ').trim().toLowerCase();
        }

        function uniqueActiveClasses(data) {
            const groups = {};
            Object.entries(data || {}).forEach(([id, c]) => {
                if (!c || c.active === false) return;
                const key = normalizeClassName(c.name || id);
                if (!key) return;
                (groups[key] ||= []).push({ id, ...c });
            });
            return Object.values(groups).map(list => {
                return list.sort((a,b) => {
                    const ac = Number(a.studentCount || 0), bc = Number(b.studentCount || 0);
                    if (bc !== ac) return bc - ac;
                    return Number(a.createdAt || 0) - Number(b.createdAt || 0);
                })[0];
            }).sort((a,b) => String(a.name || '').localeCompare(String(b.name || ''), 'id', {numeric:true, sensitivity:'base'}));
        }

        async function repairDuplicateClasses(classesData, studentsData) {
            const groups = {};
            // Ambil hasil/sesi ujian juga. Data lama bisa masih menunjuk ke classId
            // duplikat walaupun siswa sudah berada di kelas utama.
            let examResultsData = {};
            let examSessionsData = {};
            try {
                const [resSnap, sesSnap] = await Promise.all([
                    window.FB.get(window.FB.ref(window.db, 'examResults')),
                    window.FB.get(window.FB.ref(window.db, 'examSessions'))
                ]);
                examResultsData = resSnap.exists() ? (resSnap.val() || {}) : {};
                examSessionsData = sesSnap.exists() ? (sesSnap.val() || {}) : {};
            } catch (e) {
                console.warn('Gagal membaca data hasil/sesi untuk sinkronisasi kelas:', e);
            }
            Object.entries(classesData || {}).forEach(([id, c]) => {
                if (!c || c.active === false) return;
                const key = normalizeClassName(c.name || id);
                if (!key) return;
                (groups[key] ||= []).push({ id, ...c });
            });

            const updates = {};
            const merged = [];

            for (const list of Object.values(groups)) {
                if (list.length < 2) continue;

                // Pilih classId yang benar-benar dipakai paling banyak siswa.
                // Dengan begitu kelas utama tetap menjadi kelas teman-temannya.
                const counts = Object.fromEntries(list.map(x => [x.id, 0]));
                Object.values(studentsData || {}).forEach(st => {
                    if (st && counts.hasOwnProperty(st.classId)) counts[st.classId]++;
                });
                list.forEach(x => x.studentCount = counts[x.id] || 0);
                list.sort((a,b) => {
                    if (b.studentCount !== a.studentCount) return b.studentCount - a.studentCount;
                    return Number(a.createdAt || 0) - Number(b.createdAt || 0);
                });

                const canonical = list[0];
                for (const duplicate of list.slice(1)) {
                    const movedStudentIds = [];
                    // Pindahkan siswa.
                    Object.entries(studentsData || {}).forEach(([studentId, st]) => {
                        if (st && st.classId === duplicate.id) {
                            movedStudentIds.push(String(studentId));
                            updates[`students/${studentId}/classId`] = canonical.id;
                            updates[`students/${studentId}/className`] = canonical.name || '';
                        }
                    });

                    // PENTING: hasil ujian lama milik siswa yang tadi dipindahkan
                    // juga harus mengikuti classId canonical. Kalau tidak, siswa bisa
                    // terlihat "Belum Ujian" di Status Ujian padahal nilainya ada di
                    // Hasil Ujian karena hasil tersebut masih memakai classId lama.
                    Object.entries(examResultsData || {}).forEach(([resultId, r]) => {
                        if (!r) return;
                        const sid = String(r.studentId || '');
                        const belongsToMovedStudent = movedStudentIds.includes(sid);
                        const belongsToDuplicateClass = String(r.classId || '') === String(duplicate.id);
                        if (belongsToMovedStudent || (belongsToDuplicateClass && sid)) {
                            updates[`examResults/${resultId}/classId`] = canonical.id;
                            updates[`examResults/${resultId}/className`] = canonical.name || '';
                        }
                    });

                    Object.entries(examSessionsData || {}).forEach(([sessionId, sess]) => {
                        if (!sess) return;
                        const sid = String(sess.studentId || '');
                        const belongsToMovedStudent = movedStudentIds.includes(sid);
                        const belongsToDuplicateClass = String(sess.classId || '') === String(duplicate.id);
                        if (belongsToMovedStudent || (belongsToDuplicateClass && sid)) {
                            updates[`examSessions/${sessionId}/classId`] = canonical.id;
                            updates[`examSessions/${sessionId}/className`] = canonical.name || '';
                        }
                    });

                    // Kalau siswa memang sudah punya hasil ujian selesai, sinkronkan
                    // status di Master Siswa supaya tidak tertulis "Belum Ujian".
                    for (const studentId of movedStudentIds) {
                        const hasCompletedResult = Object.values(examResultsData || {}).some(r =>
                            r && String(r.studentId || '') === studentId && String(r.status || '') === 'completed'
                        );
                        if (hasCompletedResult) {
                            updates[`students/${studentId}/examStatus`] = 'completed';
                        }
                    }

                    updates[`classes/${duplicate.id}/active`] = false;
                    updates[`classes/${duplicate.id}/mergedInto`] = canonical.id;
                    updates[`classes/${duplicate.id}/mergedAt`] = Date.now();
                    merged.push(`${duplicate.name} → ${canonical.name}`);
                }
            }

            if (Object.keys(updates).length) {
                await window.FB.update(window.FB.ref(window.db), updates);
                console.info('Kelas duplikat disatukan:', merged);
            }
            return merged;
        }

        function initAdminStudents() {
            let classesLoaded = false;
            let studentsLoaded = false;
            let repairDone = false;
            let classesRaw = {};
            let studentsRaw = {};

            async function syncClasses() {
                if (!classesLoaded || !studentsLoaded || repairDone) return;
                repairDone = true;
                try { await repairDuplicateClasses(classesRaw, studentsRaw); } catch (e) { console.warn('Sinkronisasi kelas:', e); }
            }

            // Load classes for filter dropdown. Kelas aktif dengan nama sama
            // hanya ditampilkan satu kali.
            window.FB.onValue(window.FB.ref(window.db, 'classes'), (snapshot) => {
                classesRaw = snapshot.exists() ? snapshot.val() : {};
                classesLoaded = true;
                allClassesCache = classesRaw;
                window.allClassesCache = allClassesCache;

                const select = document.getElementById('filter-class-select');
                if (select) {
                    const current = select.value;
                    const unique = uniqueActiveClasses(allClassesCache);
                    select.innerHTML = '<option value="">Semua Kelas</option>' + unique.map(c =>
                        `<option value="${c.id}">${escapeHtml(c.name || c.id)}</option>`
                    ).join('');
                    if (unique.some(c => c.id === current)) select.value = current;
                }
                if (document.getElementById('results-class-filter')) initResultsFilters();
                renderStudentsTable();
                syncClasses();
            });

            window.FB.onValue(window.FB.ref(window.db, 'students'), (snapshot) => {
                studentsRaw = snapshot.exists() ? snapshot.val() : {};
                studentsLoaded = true;
                allStudentsCache = studentsRaw;
                renderStudentsTable();
                syncClasses();
            });

            document.getElementById('search-student-input').addEventListener('input', renderStudentsTable);
            document.getElementById('filter-class-select').addEventListener('change', renderStudentsTable);
        }

        function renderStudentsTable() {

            const csvCell = value => `"${String(value ?? '').replace(/"/g, '""')}"`;

            const a = document.createElement('a');
            a.href = url; a.download = 'daftar-pin-orang-tua-gama-school.csv';

        // Excel Import Handler using SheetJS
        window.handleExcelImport = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            window.showLoading(true, "Membaca file Excel...");
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    // Expected columns: NIS | Nama | Kelas
                    let successCount = 0;
                    let failCount = 0;
                    let errorDetails = [];

                    // Find class name map
                    let classNameToId = {};
                    Object.keys(allClassesCache).forEach(id => {
                        classNameToId[allClassesCache[id].name.toLowerCase().trim()] = id;
                    });

                    for (let i = 1; i < json.length; i++) {
                        const row = json[i];
                        if (!row || row.length === 0) continue;
                        const nis = String(row[0] || '').trim();
                        const name = String(row[1] || '').trim();
                        const className = String(row[2] || '').trim();

                        if (!nis || !name || !className) {
                            failCount++;
                            continue;
                        }

                        let classId = classNameToId[className.toLowerCase().trim()];
                        if (!classId) {
                            // Automatically create class if not exists
                            const newClsRef = window.FB.push(window.FB.ref(window.db, 'classes'));
                            classId = newClsRef.key;
                            await window.FB.set(newClsRef, {
                                name: className,
                                active: true,
                                createdAt: Date.now(),
                                updatedAt: Date.now()
                            });
                            classNameToId[className.toLowerCase().trim()] = classId;
                        }

                        // Save student
                        const newStRef = window.FB.push(window.FB.ref(window.db, 'students'));
                        await window.FB.set(newStRef, {
                            nis,
                            name,
                            classId,
                            className,
                            active: true,
                            examStatus: 'not_started',
                            createdAt: Date.now(),
                            updatedAt: Date.now()
                        });
                        successCount++;
                    }

                    window.showLoading(false);
                    window.showToast(`Import selesai! Berhasil: ${successCount}, Gagal: ${failCount}`, 'success');
                    event.target.value = '';
                } catch (err) {
                    window.showLoading(false);
                    console.error(err);
                    window.showToast('Gagal memproses file Excel: ' + err.message, 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        };

        };

                            <div class="bg-amber-50 border border-amber-100 rounded-xl p-4"><div class="text-xs text-amber-600 font-semibold">Filter Bab</div><div id="chapter-active-filter" class="text-sm font-extrabold text-amber-700 mt-2">Semua Bab</div></div>

                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
