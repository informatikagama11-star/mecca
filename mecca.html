        // Toast Notification Function
        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg text-sm font-medium text-white flex items-center space-x-2 transform translate-y-2 opacity-0 transition-all duration-300 ${
                type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-amber-600'
            }`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-triangle-exclamation'} text-base"></i>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        };

        window.showLoading = function(show, text = "Memproses...") {
            const loader = document.getElementById('loading-overlay');
            document.getElementById('loading-text').innerText = text;
            if(show) loader.classList.remove('hidden');
            else loader.classList.add('hidden');
        };

                        { type: 'PG', question: 'Perhatikan deret pola bangun berikut: ▲, ■, ●, ▲, ■, ●, ... Bentuk bangun kesepuluh pada pola tersebut adalah...', options: { A: 'Persegi (■)', B: 'Lingkaran (●)', C: 'Segitiga (▲)', D: 'Belah ketupat' }, correctAnswers: { C: true }, points: 1, active: true, createdAt: Date.now() },

                        { type: 'PG_COMPLEX', question: 'Tentukan dua kebenaran pernyataan mengenai pengondisian if-else dalam bahasa Python:', options: { A: 'Pengondisian digunakan agar program dapat membuat keputusan berdasarkan situasi atau kondisi tertentu.', B: 'Sintaks if dan else merupakan pasangan utama dalam struktur pengondisian Python.', C: 'Pengondisian bersarang adalah kondisi di mana perintah diulang-ulang tanpa batas waktu.', D: 'Perintah else dieksekusi ketika syarat pada pernyataan if bernilai benar (True).' }, correctAnswers: { A: true, B: true }, points: 2, active: true, createdAt: Date.now() },

                        { name: '6 Cordova', active: true, createdAt: Date.now(), updatedAt: Date.now() },
                        { name: '6 Jerusalem', active: true, createdAt: Date.now(), updatedAt: Date.now() },
                        { name: '6 Madinah', active: true, createdAt: Date.now(), updatedAt: Date.now() },
                        { name: '6 Makkah', active: true, createdAt: Date.now(), updatedAt: Date.now() }
                    ];
                    for(let c of defaultClasses) {
                        const newRef = push(classRef);
                        await set(newRef, c);
                    }
                }

                // Seed Default Settings
                const settingsRef = ref(database, 'settings');
                const setSnap = await get(settingsRef);
                if(!setSnap.exists()) {
                    await set(settingsRef, {
                        examDuration: 60,
                        examTitle: 'Evaluasi Harian TIK / Berpikir Komputasional',
                        examActive: true,
                        showStudentResult: true
                    });
                }
            } catch(err) {
                console.error("Seeding error:", err);
            } finally {
                window.showLoading(false);
            }
        }

        seedInitialQuestionsIfNeeded();
    </script>

    <script>
        const router = {
            currentRoute: 'home',
            params: {},
            navigate(route, params = {}) {
                this.currentRoute = route;
                this.params = params;
                this.render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },
            render() {
                const container = document.getElementById('app-container');
                container.innerHTML = '';
                
                // Update header title based on route
                const headerTitle = document.getElementById('header-title');
                if(this.currentRoute.startsWith('admin')) {
                    headerTitle.innerText = "Panel Admin Evaluasi";
                } else if(this.currentRoute.startsWith('student') || this.currentRoute === 'exam' || this.currentRoute === 'result') {
                    headerTitle.innerText = "Portal Siswa - Ujian Online";
                } else {
                    headerTitle.innerText = "Evaluasi Harian - Kelas Mecca";
                }

                switch(this.currentRoute) {
                    case 'home':
                        container.innerHTML = renderHomeView();
                        break;
                    case 'student-login':
                        container.innerHTML = renderStudentLoginView();
                        initStudentLogin();
                        break;
                    case 'student-confirm':
                        container.innerHTML = renderStudentConfirmView(this.params);
                        initStudentConfirm(this.params);
                        break;
                    case 'exam':
                        container.innerHTML = renderExamView(this.params);
                        initExamSession(this.params);
                        break;
                    case 'result':
                        container.innerHTML = renderResultView(this.params);
                        initResultView(this.params);
                        break;
                    case 'admin-login':
                        container.innerHTML = renderAdminLoginView();
                        initAdminLogin();
                        break;
                    case 'admin-dashboard':
                        container.innerHTML = renderAdminDashboardView();
                        initAdminDashboard();
                        break;
                    case 'admin-classes':
                        container.innerHTML = renderAdminClassesView();
                        initAdminClasses();
                        break;
                    case 'admin-students':
                        container.innerHTML = renderAdminStudentsView();
                        initAdminStudents();
                        break;
                    case 'admin-questions':
                        container.innerHTML = renderAdminQuestionsView();
                        initAdminQuestions();
                        break;
                    case 'admin-results':
                        container.innerHTML = renderAdminResultsView();
                        initAdminResults();
                        break;
                    case 'admin-result-detail':
                        container.innerHTML = renderAdminResultDetailView(this.params);
                        initAdminResultDetail(this.params);
                        break;
                    case 'admin-settings':
                        container.innerHTML = renderAdminSettingsView();
                        initAdminSettings();
                        break;
                    default:
                        container.innerHTML = renderHomeView();
                }
            }
        };

        // --- VIEWS TEMPLATES ---

        function initStudentLogin() {
            const classSelect = document.getElementById('select-class');

            let classesData = {};
            let studentsData = {};

            // Fetch classes
            window.FB.onValue(window.FB.ref(window.db, 'classes'), (snapshot) => {
                classSelect.innerHTML = '<option value="">-- Pilih Kelas Anda --</option>';
                if (snapshot.exists()) {
                    classesData = snapshot.val();
                    Object.keys(classesData).forEach(id => {
                        if (classesData[id].active !== false) {
                            classSelect.innerHTML += `<option value="${id}">${classesData[id].name}</option>`;
                        }
                    });
                }
            });

            // Fetch students
            window.FB.onValue(window.FB.ref(window.db, 'students'), (snapshot) => {
                if (snapshot.exists()) {
                    studentsData = snapshot.val();
                }
            });

            classSelect.addEventListener('change', (e) => {
                const selectedClassId = e.target.value;
                studentSelect.innerHTML = '<option value="">-- Pilih Nama Anda --</option>';
                if (!selectedClassId) {
                    studentSelect.disabled = true;
                    studentSelect.classList.add('bg-slate-50');
                    return;
                }

                studentSelect.disabled = false;
                studentSelect.classList.remove('bg-slate-50');

                let count = 0;
                Object.keys(studentsData).forEach(id => {
                    const st = studentsData[id];
                    if (st.classId === selectedClassId && st.active !== false) {
                        studentSelect.innerHTML += `<option value="${id}" data-nis="${st.nis}" data-name="${st.name}" data-classname="${st.className || ''}">${st.name} (NIS: ${st.nis})</option>`;
                        count++;
                    }
                });

                if (count === 0) {
                    studentSelect.innerHTML = '<option value="">Tidak ada siswa terdaftar di kelas ini</option>';

                }
            });

            form.addEventListener('submit', (e) => {

                const studentName = opt.getAttribute('data-name');

                const classId = classSelect.value;
                const className = classSelect.options[classSelect.selectedIndex].text;

                router.navigate('student-confirm', { studentId, studentName, nis, classId, className });
            });
        }

        function initStudentConfirm(params) {
            document.getElementById('btn-start-exam').addEventListener('click', async () => {
                window.showLoading(true, "Mempersiapkan sesi ujian dan mengacak soal...");
                try {
                    // Check if student already completed
                    const resultsRef = window.FB.ref(window.db, 'examResults');
                    const rSnap = await window.FB.get(resultsRef);
                    let alreadyCompleted = false;
                    if (rSnap.exists()) {
                        const allRes = rSnap.val();
                        Object.keys(allRes).forEach(k => {
                            if (allRes[k].studentId === params.studentId && allRes[k].status === 'completed') {
                                alreadyCompleted = true;
                            }
                        });
                    }

                    if (alreadyCompleted) {
                        window.showLoading(false);
                        window.showToast('Anda sudah menyelesaikan ujian ini sebelumnya!', 'error');
                        router.navigate('home');
                        return;
                    }

                    // Fetch settings for duration
                    const setSnap = await window.FB.get(window.FB.ref(window.db, 'settings'));
                    const settings = setSnap.exists() ? setSnap.val() : { examDuration: 60 };
                    const durationMinutes = parseInt(settings.examDuration) || 60;

                    // Fetch active questions
                    const qSnap = await window.FB.get(window.FB.ref(window.db, 'questions'));
                    if (!qSnap.exists()) {
                        window.showLoading(false);
                        window.showToast('Bank soal belum tersedia!', 'error');
                        return;
                    }

                    const qData = qSnap.val();
                    let pgList = [];
                    let complexList = [];

                    Object.keys(qData).forEach(id => {
                        if (qData[id].active !== false) {
                            if (qData[id].type === 'PG') pgList.push({ id, ...qData[id] });
                            else if (qData[id].type === 'PG_COMPLEX') complexList.push({ id, ...qData[id] });
                        }
                    });

                    if (pgList.length < 15 || complexList.length < 10) {
                        window.showLoading(false);
                        window.showToast(`Soal belum mencukupi! Dibutuhkan 15 PG (tersedia ${pgList.length}) dan 10 PG Kompleks (tersedia ${complexList.length}).`, 'error');
                        router.navigate('home');
                        return;
                    }

                    // Randomize function (Fisher-Yates)
                    function shuffle(array) {
                        let arr = [...array];
                        for (let i = arr.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [arr[i], arr[j]] = [arr[j], arr[i]];
                        }
                        return arr;
                    }

                    const selectedPG = shuffle(pgList).slice(0, 15);
                    const selectedComplex = shuffle(complexList).slice(0, 10);
                    const combinedQuestions = shuffle([...selectedPG, ...selectedComplex]);

                    // Randomize options for each question and map option mapping
                    let questionIdsMap = {};
                    combinedQuestions.forEach(q => {
                        const originalOptions = q.options; // {A, B, C, D}
                        const keys = Object.keys(originalOptions);
                        const shuffledKeys = shuffle(keys); // e.g. ['C', 'A', 'D', 'B']

                        let newOptions = {};
                        let newCorrectAnswers = {};

                        shuffledKeys.forEach((oldKey, newIdx) => {
                            const newKey = String.fromCharCode(65 + newIdx); // A, B, C, D
                            newOptions[newKey] = originalOptions[oldKey];
                            if (q.correctAnswers[oldKey]) {
                                newCorrectAnswers[newKey] = true;
                            }
                        });

                        questionIdsMap[q.id] = {
                            shuffledOptions: newOptions,
                            shuffledCorrectAnswers: newCorrectAnswers,
                            originalQuestionId: q.id,
                            type: q.type
                        };
                    });

                    // Check if student has active session already
                    const sessionRef = window.FB.ref(window.db, 'examSessions');
                    const sSnap = await window.FB.get(sessionRef);
                    let existingSessionId = null;
                    if (sSnap.exists()) {
                        const allSessions = sSnap.val();
                        Object.keys(allSessions).forEach(sid => {
                            if (allSessions[sid].studentId === params.studentId && allSessions[sid].status === 'active') {
                                existingSessionId = sid;
                            }
                        });
                    }

                    let sessionId;
                    const startTime = Date.now();
                    const endTime = startTime + (durationMinutes * 60 * 1000);

                    if (existingSessionId) {
                        sessionId = existingSessionId;
                    } else {
                        const newSessRef = window.FB.push(window.FB.ref(window.db, 'examSessions'));
                        sessionId = newSessRef.key;
                        await window.FB.set(newSessRef, {
                            sessionId,
                            studentId: params.studentId,
                            studentName: params.studentName,
                            nis: params.nis,
                            classId: params.classId,
                            className: params.className,
                            questionMap: questionIdsMap,
                            questionIds: combinedQuestions.map(q => q.id),
                            startTime,
                            endTime,
                            duration: durationMinutes,
                            status: 'active',
                            answers: {}
                        });
                    }

                    window.showLoading(false);
                    router.navigate('exam', { sessionId, studentId: params.studentId });

                } catch (err) {
                    window.showLoading(false);
                    console.error(err);
                    window.showToast('Gagal memulai ujian: ' + err.message, 'error');
                }
            });
        }

        async function initExamSession(params) {
            currentExamState.sessionId = params.sessionId;
            currentExamState.studentId = params.studentId;

            window.showLoading(true, "Memuat soal ujian...");
            try {
                // Fetch session

                }

                if (sessData.status === 'completed') {
                    window.showLoading(false);
                    router.navigate('result', { sessionId: params.sessionId });
                    return;
                }

                document.getElementById('exam-student-name').innerText = sessData.studentName;
                document.getElementById('exam-student-class').innerText = `Kelas: ${sessData.className} | NIS: ${sessData.nis}`;

                currentExamState.questionIds = sessData.questionIds;
                currentExamState.questionMap = sessData.questionMap;
                currentExamState.answers = sessData.answers || {};

                // Fetch actual questions content
                const qSnap = await window.FB.get(window.FB.ref(window.db, 'questions'));
                currentExamState.allQuestionsData = qSnap.val() || {};

                window.showLoading(false);

                // Start Timer
                startExamTimer(sessData.endTime);

                // Render first question
                renderQuestion(0);
                renderPalette();

            } catch (err) {
                window.showLoading(false);
                console.error(err);
                window.showToast('Gagal memuat ujian!', 'error');
            }
        }

        function startExamTimer(endTime) {
            if (currentExamState.timerInterval) clearInterval(currentExamState.timerInterval);

            currentExamState.timerInterval = setInterval(() => {
                const now = Date.now();
                const diff = endTime - now;

                if (diff <= 0) {
                    clearInterval(currentExamState.timerInterval);
                    document.getElementById('timer-display').innerText = "00:00:00";
                    window.showToast('Waktu ujian telah habis!', 'error');
                    autoSubmitExamDueToTime();
                    return;
                }

                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('timer-display').innerText = 
                    `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }, 1000);
        }

        function renderQuestion(index) {
            currentExamState.currentIndex = index;
            const qId = currentExamState.questionIds[index];
            const qMeta = currentExamState.questionMap[qId];
            const qRaw = currentExamState.allQuestionsData[qId];

            if (!qRaw || !qMeta) return;

            document.getElementById('q-number-indicator').innerText = `Soal ${index + 1} dari ${currentExamState.questionIds.length}`;
            const typeBadge = document.getElementById('q-type-badge');
            if (qMeta.type === 'PG') {
                typeBadge.innerText = 'Pilihan Ganda (1 Poin)';
                typeBadge.className = 'px-3 py-1 bg-indigo-50 text-indigo-700 rounded-lg text-xs font-bold uppercase tracking-wider';
            } else {
                typeBadge.innerText = 'Pilihan Ganda Kompleks (Tepat 2 Jawaban - 2 Poin)';
                typeBadge.className = 'px-3 py-1 bg-amber-50 text-amber-700 rounded-lg text-xs font-bold uppercase tracking-wider';
            }

            document.getElementById('question-text').innerText = `${index + 1}. ${qRaw.question}`;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const shuffledOpts = qMeta.shuffledOptions; // {A: text, B: text, C: text, D: text}
            const currentAnswer = currentExamState.answers[qId] || (qMeta.type === 'PG' ? '' : []);

            Object.keys(shuffledOpts).sort().forEach(key => {
                const optText = shuffledOpts[key];
                const isChecked = qMeta.type === 'PG' ? (currentAnswer === key) : (Array.isArray(currentAnswer) && currentAnswer.includes(key));

                if (qMeta.type === 'PG') {
                    optionsContainer.innerHTML += `
                        <label class="flex items-start p-4 rounded-xl border-2 transition cursor-pointer ${isChecked ? 'border-brand-600 bg-brand-50/50' : 'border-slate-200 hover:bg-slate-50'}">
                            <input type="radio" name="answer-${qId}" value="${key}" ${isChecked ? 'checked' : ''} onchange="handleAnswerChange('${qId}', '${key}', 'PG')" class="mt-1 h-4 w-4 text-brand-600 focus:ring-brand-500">

        window.navigateQuestion = function(direction) {
            const newIndex = currentExamState.currentIndex + direction;
            if (newIndex >= 0 && newIndex < currentExamState.questionIds.length) {
                renderQuestion(newIndex);
            }
        };

        window.handleAnswerChange = async function(qId, optionKey, type) {
            if (type === 'PG') {
                currentExamState.answers[qId] = optionKey;
            } else {
                // PG Complex: Max 2 answers
                if (!Array.isArray(currentExamState.answers[qId])) {
                    currentExamState.answers[qId] = [];
                }
                let arr = currentExamState.answers[qId];
                const idx = arr.indexOf(optionKey);
                if (idx > -1) {
                    arr.splice(idx, 1);
                } else {
                    if (arr.length >= 2) {
                        window.showToast('Maksimal 2 jawaban untuk PG Kompleks!', 'error');
                        renderQuestion(currentExamState.currentIndex); // re-render to uncheck
                        return;
                    }
                    arr.push(optionKey);
                }
                currentExamState.answers[qId] = arr;
            }

            renderPalette();

            // Autosave to Firebase Realtime Database
            try {
                const answerRef = window.FB.ref(window.db, `examSessions/${currentExamState.sessionId}/answers`);
                await window.FB.update(answerRef, {
                    [qId]: currentExamState.answers[qId]
                });
            } catch (err) {
                console.error("Autosave error:", err);
                window.showToast('Koneksi terputus. Menyimpan jawaban secara lokal...', 'warning');
            }
        };

        function renderPalette() {
            const paletteContainer = document.getElementById('question-grid-palette');
            paletteContainer.innerHTML = '';
            let answeredCount = 0;

            currentExamState.questionIds.forEach((qId, idx) => {
                const ans = currentExamState.answers[qId];
                let isAnswered = false;
                if (Array.isArray(ans)) {
                    if (ans.length > 0) isAnswered = true;
                } else if (ans) {
                    isAnswered = true;
                }

                if (isAnswered) answeredCount++;

                const isActive = idx === currentExamState.currentIndex;
                let btnClass = "h-10 rounded-xl font-semibold text-sm flex items-center justify-center transition border ";

                if (isActive) {
                    btnClass += "border-brand-600 bg-brand-50 text-brand-700 ring-2 ring-brand-500/20";
                } else if (isAnswered) {
                    btnClass += "bg-emerald-500 text-white border-emerald-600 shadow-sm";
                } else {
                    btnClass += "bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200";
                }

                paletteContainer.innerHTML += `
                    <button onclick="renderQuestion(${idx})" class="${btnClass}">${idx + 1}</button>
                `;
            });

            document.getElementById('answered-count').innerText = `${answeredCount}/25 Terjawab`;
        }

            const modalContainer = document.getElementById('modal-container');

            modalContent.innerHTML = `

        async function autoSubmitExamDueToTime() {

        window.executeSubmitExam = async function(isTimeout = false) {
            closeModal();
            if (currentExamState.timerInterval) clearInterval(currentExamState.timerInterval);

            window.showLoading(true, "Menghitung nilai dan menyimpan hasil ujian...");
            try {
                // Fetch session again to ensure all data is up to date
                const sessSnap = await window.FB.get(window.FB.ref(window.db, `examSessions/${currentExamState.sessionId}`));
                const sessData = sessSnap.val();

                const answers = sessData.answers || {};
                const questionMap = sessData.questionMap;

                let pgCorrect = 0;
                let pgComplexPoints = 0;

                Object.keys(questionMap).forEach(qId => {
                    const qMeta = questionMap[qId];
                    const studentAns = answers[qId];

                    if (qMeta.type === 'PG') {
                        if (studentAns && qMeta.shuffledCorrectAnswers[studentAns]) {
                            pgCorrect++;
                        }
                    } else if (qMeta.type === 'PG_COMPLEX') {
                        // Complex scoring: 1 point per correct option chosen. Max 2 points.
                        if (Array.isArray(studentAns)) {
                            let correctChosen = 0;
                            studentAns.forEach(opt => {
                                if (qMeta.shuffledCorrectAnswers[opt]) {
                                    correctChosen++;
                                }
                            });
                            // Cap at 2 points max per question
                            pgComplexPoints += Math.min(correctChosen, 2);
                        }
                    }
                });

                const totalPoints = pgCorrect + pgComplexPoints; // Max 35
                const maxPoints = 35;
                const finalScore = parseFloat(((totalPoints / maxPoints) * 100).toFixed(2));
                const submitTime = Date.now();

                // Save Result with Push ID
                const resultRef = window.FB.push(window.FB.ref(window.db, 'examResults'));
                const resultId = resultRef.key;

                const resultPayload = {
                    resultId,
                    sessionId: currentExamState.sessionId,
                    studentId: sessData.studentId,
                    studentName: sessData.studentName,
                    nis: sessData.nis,
                    classId: sessData.classId,
                    className: sessData.className,
                    pgCorrect,
                    pgComplexPoints,
                    totalPoints,
                    maxPoints,
                    finalScore,
                    startTime: sessData.startTime,
                    submitTime,
                    status: 'completed'
                };

                await window.FB.set(resultRef, resultPayload);

                // Update session status
                await window.FB.update(window.FB.ref(window.db, `examSessions/${currentExamState.sessionId}`), {
                    status: 'completed',
                    submitTime,
                    totalPoints,
                    finalScore
                });

                // Update student status in students list
                await window.FB.update(window.FB.ref(window.db, `students/${sessData.studentId}`), {
                    examStatus: 'completed'
                });

                // Save History
                const historyRef = window.FB.ref(window.db, `examHistory/${sessData.studentId}`);
                const attemptRef = window.FB.push(historyRef);
                await window.FB.set(attemptRef, {
                    resultId,
                    totalPoints,
                    finalScore,
                    submitTime,
                    detail: answers
                });

                window.showLoading(false);
                if (isTimeout) {
                    window.showToast('Waktu habis! Ujian berhasil dikumpulkan.', 'success');
                } else {
                    window.showToast('Ujian berhasil dikumpulkan!', 'success');
                }

                router.navigate('result', { sessionId: currentExamState.sessionId, resultId });

            } catch (err) {
                window.showLoading(false);
                console.error(err);
                window.showToast('Gagal mengumpulkan ujian: ' + err.message, 'error');
            }
        };

        function initAdminDashboard() {
            // Realtime listeners
            window.FB.onValue(window.FB.ref(window.db, 'classes'), (snapshot) => {
                let count = 0;
                if (snapshot.exists()) {
                    count = Object.keys(snapshot.val()).length;
                }
                document.getElementById('stat-total-classes').innerText = count;
            });

            window.FB.onValue(window.FB.ref(window.db, 'students'), (snapshot) => {
                let count = 0;
                if (snapshot.exists()) {
                    count = Object.keys(snapshot.val()).length;
                }
                document.getElementById('stat-total-students').innerText = count;
            });

            window.FB.onValue(window.FB.ref(window.db, 'questions'), (snapshot) => {
                let count = 0;
                if (snapshot.exists()) {
                    const q = snapshot.val();
                    Object.keys(q).forEach(k => { if (q[k].active !== false) count++; });
                }
                document.getElementById('stat-total-questions').innerText = count;
            });

            window.FB.onValue(window.FB.ref(window.db, 'examResults'), (snapshot) => {
                const tbody = document.getElementById('recent-results-tbody');
                tbody.innerHTML = '';

                if (!snapshot.exists()) {
                    tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-slate-400">Belum ada hasil ujian.</td></tr>`;
                    document.getElementById('stat-completed-exams').innerText = '0';
                    document.getElementById('stat-avg-score').innerText = '0.00';
                    document.getElementById('stat-max-score').innerText = '0';
                    document.getElementById('stat-min-score').innerText = '0';
                    return;
                }

                const results = snapshot.val();
                const keys = Object.keys(results);
                document.getElementById('stat-completed-exams').innerText = keys.length;

                let scores = [];
                let rowsHTML = '';

                keys.sort((a, b) => results[b].submitTime - results[a].submitTime).forEach((k, idx) => {
                    const r = results[k];
                    scores.push(r.finalScore);
                    if (idx < 5) {
                        rowsHTML += `
                            <tr class="hover:bg-slate-50 transition">
                                <td class="py-3 px-4 font-medium text-slate-700">${r.nis || '-'}</td>
                                <td class="py-3 px-4 font-bold text-slate-900">${r.studentName}</td>
                                <td class="py-3 px-4 text-slate-600">${r.className || '-'}</td>
                                <td class="py-3 px-4 font-semibold text-slate-700">${r.totalPoints} / 35</td>
                                <td class="py-3 px-4"><span class="px-2.5 py-1 bg-emerald-50 text-emerald-700 rounded-lg font-bold text-xs">${r.finalScore}</span></td>
                            </tr>
                        `;
                    }
                });

                tbody.innerHTML = rowsHTML || `<tr><td colspan="5" class="py-4 text-center text-slate-400">Belum ada hasil ujian.</td></tr>`;

                const sum = scores.reduce((a, b) => a + b, 0);
                const avg = (sum / scores.length).toFixed(2);
                const max = Math.max(...scores).toFixed(2);
                const min = Math.min(...scores).toFixed(2);

                document.getElementById('stat-avg-score').innerText = avg;
                document.getElementById('stat-max-score').innerText = max;
                document.getElementById('stat-min-score').innerText = min;
            });
        }

        function renderStudentsTable() {
            const tbody = document.getElementById('students-tbody');
            if (!tbody) return;
            tbody.innerHTML = '';

            const searchKey = document.getElementById('search-student-input').value.toLowerCase();
            const classFilter = document.getElementById('filter-class-select').value;

            const keys = Object.keys(allStudentsCache);
            if (keys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-400">Tidak ada data siswa.</td></tr>`;
                return;
            }

            let count = 0;
            keys.forEach(id => {
                const s = allStudentsCache[id];
                const matchSearch = (s.name && s.name.toLowerCase().includes(searchKey)) || (s.nis && s.nis.toLowerCase().includes(searchKey));
                const matchClass = !classFilter || s.classId === classFilter;

                if (matchSearch && matchClass) {
                    count++;
                    const statusBadge = s.examStatus === 'completed' 
                        ? '<span class="px-2.5 py-1 bg-emerald-50 text-emerald-700 rounded-full text-xs font-semibold">Selesai</span>' 
                        : '<span class="px-2.5 py-1 bg-amber-50 text-amber-700 rounded-full text-xs font-semibold">Belum Ujian</span>';

                            <td class="py-4 px-6 font-bold text-slate-900">${s.name}</td>

            });

            if (count === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-400">Siswa tidak ditemukan.</td></tr>`;
            }
        }

        // Excel Import Handler using SheetJS
        window.handleExcelImport = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            window.showLoading(true, "Membaca file Excel...");
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    // Expected columns: NIS | Nama | Kelas
                    let successCount = 0;
                    let failCount = 0;
                    let errorDetails = [];

                    // Find class name map
                    let classNameToId = {};
                    Object.keys(allClassesCache).forEach(id => {
                        classNameToId[allClassesCache[id].name.toLowerCase().trim()] = id;
                    });

                    for (let i = 1; i < json.length; i++) {
                        const row = json[i];
                        if (!row || row.length === 0) continue;
                        const nis = String(row[0] || '').trim();
                        const name = String(row[1] || '').trim();
                        const className = String(row[2] || '').trim();

                        if (!nis || !name || !className) {
                            failCount++;
                            continue;
                        }

                        let classId = classNameToId[className.toLowerCase().trim()];
                        if (!classId) {
                            // Automatically create class if not exists
                            const newClsRef = window.FB.push(window.FB.ref(window.db, 'classes'));
                            classId = newClsRef.key;
                            await window.FB.set(newClsRef, {
                                name: className,
                                active: true,
                                createdAt: Date.now(),
                                updatedAt: Date.now()
                            });
                            classNameToId[className.toLowerCase().trim()] = classId;
                        }

                        // Save student
                        const newStRef = window.FB.push(window.FB.ref(window.db, 'students'));
                        await window.FB.set(newStRef, {
                            nis,
                            name,
                            classId,
                            className,
                            active: true,
                            examStatus: 'not_started',
                            createdAt: Date.now(),
                            updatedAt: Date.now()
                        });
                        successCount++;
                    }

                    window.showLoading(false);
                    window.showToast(`Import selesai! Berhasil: ${successCount}, Gagal: ${failCount}`, 'success');
                    event.target.value = '';
                } catch (err) {
                    window.showLoading(false);
                    console.error(err);
                    window.showToast('Gagal memproses file Excel: ' + err.message, 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        };

        async function initAdminResultDetail(params) {
            window.showLoading(true, "Memuat detail jawaban...");
            try {
                const rSnap = await window.FB.get(window.FB.ref(window.db, `examResults/${params.resultId}`));
                if (!rSnap.exists()) {
                    window.showLoading(false);
                    window.showToast('Hasil tidak ditemukan!', 'error');

                    return;
                }
                const resData = rSnap.val();

                const sessSnap = await window.FB.get(window.FB.ref(window.db, `examSessions/${resData.sessionId}`));
                const sessData = sessSnap.val();

                const qSnap = await window.FB.get(window.FB.ref(window.db, 'questions'));
                const allQuestions = qSnap.val() || {};

                document.getElementById('detail-name').innerText = resData.studentName;
                document.getElementById('detail-class').innerText = `${resData.className || '-'} (NIS: ${resData.nis || '-'})`;
                document.getElementById('detail-score').innerText = resData.finalScore;

                const container = document.getElementById('detail-questions-container');
                container.innerHTML = '';

                const questionIds = sessData.questionIds || [];
                const questionMap = sessData.questionMap || {};
                const studentAnswers = sessData.answers || {};

                questionIds.forEach((qId, idx) => {
                    const qMeta = questionMap[qId];
                    const qRaw = allQuestions[qId];
                    const studentAns = studentAnswers[qId];

                    if (!qRaw || !qMeta) return;

                    let studentAnsStr = '-';
                    let correctAnsStr = '';
                    let earnedPoints = 0;

                    if (qMeta.type === 'PG') {
                        studentAnsStr = studentAns ? `${studentAns}. ${qMeta.shuffledOptions[studentAns] || ''}` : 'Tidak dijawab';
                        const correctKey = Object.keys(qMeta.shuffledCorrectAnswers)[0];
                        correctAnsStr = `${correctKey}. ${qMeta.shuffledOptions[correctKey] || ''}`;
                        if (studentAns && qMeta.shuffledCorrectAnswers[studentAns]) earnedPoints = 1;
                    } else {
                        if (Array.isArray(studentAns) && studentAns.length > 0) {
                            studentAnsStr = studentAns.map(k => `${k}. ${qMeta.shuffledOptions[k] || ''}`).join(', ');
                            let correctChosen = 0;
                            studentAns.forEach(k => { if (qMeta.shuffledCorrectAnswers[k]) correctChosen++; });
                            earnedPoints = Math.min(correctChosen, 2);
                        } else {
                            studentAnsStr = 'Tidak dijawab';
                        }
                        const correctKeys = Object.keys(qMeta.shuffledCorrectAnswers);
                        correctAnsStr = correctKeys.map(k => `${k}. ${qMeta.shuffledOptions[k] || ''}`).join(', ');
                    }

                    container.innerHTML += `
                        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
                            <div class="flex items-center justify-between mb-2">
                                <span class="font-bold text-slate-800">Soal ${idx + 1} (${qMeta.type === 'PG' ? 'PG' : 'PG Kompleks'})</span>
                                <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${earnedPoints > 0 ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}">Poin: ${earnedPoints} / ${qMeta.type === 'PG' ? 1 : 2}</span>
                            </div>
                            <p class="text-slate-900 font-medium mb-4">${qRaw.question}</p>
                            <div class="bg-slate-50 p-4 rounded-xl space-y-2 text-sm border border-slate-200">
                                <div class="flex"><span class="w-32 font-semibold text-slate-500">Jawaban Siswa:</span> <span class="font-bold text-slate-800">${studentAnsStr}</span></div>
                                <div class="flex"><span class="w-32 font-semibold text-slate-500">Kunci Jawaban:</span> <span class="font-bold text-emerald-600">${correctAnsStr}</span></div>
                            </div>
                        </div>
                    `;
                });

                window.showLoading(false);
            } catch (err) {
                window.showLoading(false);
                console.error(err);
                window.showToast('Gagal memuat detail jawaban!', 'error');
            }
        }

        // --- ADMIN SETTINGS VIEW ---

        function renderAdminSettingsView() {
            return `
                <div>
                    ${renderAdminNavbar('settings')}
                    <div class="max-w-xl bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
                        <h2 class="text-xl font-bold text-slate-900 mb-6">Pengaturan Ujian</h2>
                        <form id="settings-form" class="space-y-6">
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-2">Judul Ujian</label>
                                <input type="text" id="set-title" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-2">Durasi Ujian (Menit)</label>
                                <input type="number" id="set-duration" required min="1" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 outline-none">
                            </div>
                            <button type="submit" class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-lg transition">
                                Simpan Pengaturan
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        async function initAdminSettings() {
            window.showLoading(true, "Memuat pengaturan...");
            try {
                const snap = await window.FB.get(window.FB.ref(window.db, 'settings'));
                if (snap.exists()) {
                    const settings = snap.val();
                    document.getElementById('set-title').value = settings.examTitle || '';
                    document.getElementById('set-duration').value = settings.examDuration || 60;
                }
                window.showLoading(false);
            } catch (err) {
                window.showLoading(false);
                console.error(err);
            }

            document.getElementById('settings-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const examTitle = document.getElementById('set-title').value;
                const examDuration = parseInt(document.getElementById('set-duration').value) || 60;

                try {
                    await window.FB.set(window.FB.ref(window.db, 'settings'), {
                        examTitle,
                        examDuration,
                        examActive: true,
                        showStudentResult: true
                    });
                    window.showToast('Pengaturan berhasil disimpan!', 'success');
                } catch (err) {
                    window.showToast('Gagal menyimpan pengaturan: ' + err.message, 'error');
                }
            });
        }

        // Initialize Router on Window Load
        window.onload = function() {
            // Check auth state for Firebase
            window.auth.onAuthStateChanged((user) => {
                // Initial load
                router.navigate('home');
            });
        };
    </script>
</body>
</html>
